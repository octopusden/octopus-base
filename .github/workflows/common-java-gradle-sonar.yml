name: Gradle Sonar

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version used to run the build. The scanner provisions its own JDK 21 for the analysis step, so this is the project's version, not the scanner's.
        required: true
        type: string
      java-distribution:
        description: Java distribution passed to actions/setup-java
        required: false
        type: string
        default: temurin
      runs-on:
        description: GitHub runner label
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout in minutes for the analysis job
        required: false
        type: number
        default: 20
      sonar-host-url:
        description: Sonar server URL
        required: false
        type: string
        default: https://sonarcloud.io
      sonar-organization:
        description: Sonar organization key. Defaults to the GitHub owner, which is what makes the move between Sonar organizations a token swap rather than a commit in every consumer.
        required: false
        type: string
        default: ''
      sonar-project-key:
        description: Sonar project key. Defaults to <owner>_<repo>.
        required: false
        type: string
        default: ''
      sonar-command:
        description: Gradle command that runs the analysis. Must compile before analysing — see the step comment.
        required: false
        type: string
        default: ./gradlew build testClasses -x test sonar --no-daemon --stacktrace
      default-branch:
        description: Branch that non-default branches are compared against for new code. Empty means the repository's own default branch.
        required: false
        type: string
        default: ''
      quality-gate-wait:
        description: Fail the job when the quality gate is red
        required: false
        type: boolean
        default: true
      version-tag-regex:
        description: Regex selecting release tags. Must match the release workflow's, or Sonar's "previous version" baseline and the released version disagree.
        required: false
        type: string
        default: '^v([0-9]+)\..*'
      fallback-version:
        description: sonar.projectVersion for a repository that has no release tag yet
        required: false
        type: string
        default: '0.0.0'
      continue-on-error:
        description: Report without failing the workflow. Overrides quality-gate-wait in effect, since a red gate then no longer blocks.
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  sonar:
    name: sonar/analysis
    runs-on: ${{ inputs.runs-on }}
    environment: Prod
    continue-on-error: ${{ inputs.continue-on-error }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      # Sonar reads SCM blame; a shallow clone does not fail, it answers wrongly.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Cache Sonar analyzers and provisioned JRE
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # A reusable workflow runs against the caller's checkout, so this repo's scripts are fetched.
      - name: Resolve helper ref
        id: helper-ref
        env:
          HELPER_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${HELPER_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Cannot pin the Sonar helper::job.workflow_sha resolved to '${HELPER_SHA}', which is not a full commit SHA." >&2
            exit 1
          fi
          echo "sha=${HELPER_SHA}" >> "$GITHUB_OUTPUT"

      - name: Fetch Sonar helper
        uses: actions/checkout@v4
        with:
          repository: octopusden/octopus-base
          ref: ${{ steps.helper-ref.outputs.sha }}
          path: .octopus-base-sonar
          sparse-checkout: .github/scripts

      # continue-on-error: a repository with no release tag falls through to the fallback version.
      - name: Find latest release tag
        id: latest-tag
        continue-on-error: true
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ github.repository }}
          regex: ${{ inputs.version-tag-regex }}

      - name: Resolve analysis parameters
        id: params
        shell: bash
        env:
          ORGANIZATION_INPUT: ${{ inputs.sonar-organization }}
          PROJECT_KEY_INPUT: ${{ inputs.sonar-project-key }}
          LATEST_TAG: ${{ steps.latest-tag.outputs.tag }}
          FALLBACK_VERSION: ${{ inputs.fallback-version }}
          DEFAULT_BRANCH_INPUT: ${{ inputs.default-branch }}
          REPO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: bash .octopus-base-sonar/.github/scripts/sonar-analysis-params.sh

      - name: Run Sonar analysis
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
          SONAR_COMMAND: ${{ inputs.sonar-command }}
          SONAR_ORGANIZATION: ${{ steps.params.outputs.organization }}
          SONAR_PROJECT_KEY: ${{ steps.params.outputs.project-key }}
          SONAR_PROJECT_VERSION: ${{ steps.params.outputs.version }}
          SONAR_REFERENCE_BRANCH: ${{ steps.params.outputs.reference-branch }}
          QUALITY_GATE_WAIT: ${{ inputs.quality-gate-wait }}
        run: |
          set -euo pipefail

          reference_arg=()
          if [[ -n "${SONAR_REFERENCE_BRANCH}" ]]; then
            reference_arg=(-Dsonar.newCode.referenceBranch="${SONAR_REFERENCE_BRANCH}")
          fi

          # `testClasses` is named because `-x test` would otherwise drop it, leaving test sources
          # without bytecode. Reverse the whole `-x test` when coverage is wired up.
          # shellcheck disable=SC2086 # sonar-command is a command line, splitting is the point
          ${SONAR_COMMAND} \
            "${reference_arg[@]}" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.projectVersion="${SONAR_PROJECT_VERSION}" \
            -Dsonar.qualitygate.wait="${QUALITY_GATE_WAIT}"

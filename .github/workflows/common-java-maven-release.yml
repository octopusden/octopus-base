# This is a basic release workflow for Octopus Maven Java modules with publishing to Sonatype Nexus
name: Maven Release

on:
  workflow_call:
    inputs:
      flow-type:
        required: true
        type: string # one of { public, hybrid }
      java-version:
        required: true
        type: string
      increment-version-level:
        description: 'One of: {major, premajor, minor, preminor, patch, prepatch, prerelease}'
        required: false
        type: string
        default: patch
      commit-hash:
        description: 'Hash of the commit to checkout (for hybrid flow)'
        required: false
        type: string
        default: ''
      build-version:
        description: 'Version number to release (for hybrid flow)'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Run release flow without external side effects such as publishing or release creation'
        required: false
        type: boolean
        default: false
      register-release-immediately:
        description: 'Register release in octopus-release-log immediately (true) or wait for artifact check (false)'
        required: false
        type: boolean
        default: false
      release-mvn-parameters:
        type: string
        default: ''
    secrets:
      OSSRH_USERNAME:
        required: false
      OSSRH_TOKEN:
        required: false
      GPG_PASSPHRASE:
        required: false
      GPG_PRIVATE_KEY:
        required: false

jobs:
  prepare-build-publish-release:
    runs-on: ubuntu-latest
    environment: Prod
    # The version is an input only for the hybrid flow; the public flow computes it
    # here. Publishing it as an output is what lets registration receive the version
    # that was actually released instead of an empty string.
    outputs:
      build-version: ${{ inputs.build-version || steps.new-version.outputs.version }}
      # The commit this job actually built. Published so the tagging job tags exactly
      # that, instead of re-resolving a ref that may have moved in the meantime.
      built-sha: ${{ steps.built-commit.outputs.sha }}
    env:
      BUILD_VERSION: ''

    steps:
      # check input parameters
      - name: Unknown flow
        if: inputs.flow-type != 'public' && inputs.flow-type != 'hybrid'
        run: |
          echo "Unknown flow specified, should be one of {public, hybrid}: " ${{ inputs.flow-type }}
          exit 1

      - name: Fail if commit-hash is not set for hybrid flow
        if: inputs.flow-type == 'hybrid' && !inputs.commit-hash
        run: |
          echo "commit-hash input parameter must be set for hybrid flow"
          exit 1

      - name: Fail if build-version is not set for hybrid flow
        if: inputs.flow-type == 'hybrid' && !inputs.build-version
        run: |
          echo "build-version input parameter must be set for hybrid flow"
          exit 1

      - name: Public flow
        if: inputs.flow-type == 'public'
        run: |
          echo "Public flow, run with tests"

      - name: Hybrid flow
        if: inputs.flow-type == 'hybrid'
        run: |
          echo "Hybrid flow:"
          echo "- Skipping tests"
          echo "- Commit hash: ${{ inputs.commit-hash }}"
          echo "- Version: ${{ inputs.build-version }}"
          # set hybrid flow variables
          echo "SKIP_TESTS=-x test" >> $GITHUB_ENV
          echo "BUILD_VERSION=${{ inputs.build-version }}" >> $GITHUB_ENV

      - name: Dry run mode
        if: inputs.dry-run
        run: |
          echo "Dry run mode enabled:"
          echo "- External publishing steps will be skipped"
          echo "- GitHub release creation will be skipped"
          echo "- Release log registration will be skipped"

      - name: Fail if release secrets are not set for non-dry-run
        if: ${{ !inputs.dry-run }}
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          missing=()
          for secret_name in OSSRH_USERNAME OSSRH_TOKEN GPG_PASSPHRASE GPG_PRIVATE_KEY; do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("${secret_name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required release secrets for non-dry-run: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      # checkout
      - name: Checkout latest
        if: inputs.flow-type == 'public'
        uses: actions/checkout@v3

      - name: Checkout from commit hash
        if: inputs.flow-type == 'hybrid' && inputs.commit-hash
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.commit-hash }}

      - name: Record the built commit
        id: built-commit
        run: |
          # Assign first: `echo "sha=$(git rev-parse HEAD)"` succeeds even when rev-parse
          # fails, writing an empty sha that is only caught after the publish.
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          # Leave the commit where a failed run's reader will find it: as an annotation on the
          # run page and in the step summary, not only in a job output that a failed job does
          # not expose. A run that dies after Central accepted the upload is recovered by
          # tagging THIS commit (octopus-base#189). This flow has no resume path, so HEAD is
          # always the built commit here.
          echo "::notice title=Built commit::${sha}"
          { echo "### Built commit"; echo ""; echo "\`${sha}\`"; } >> "$GITHUB_STEP_SUMMARY"

      # A release must be able to tag the commit it builds — and for some commits the
      # Actions GITHUB_TOKEN cannot. GitHub refuses any ref update, REST or git push,
      # that points a ref at a commit carrying a workflow file that exists on no branch
      # head, unless the token is authorized to modify workflows, which GITHUB_TOKEN can
      # never be. Measured against a real repository with a token lacking `workflow`
      # scope, which is the same authorization GITHUB_TOKEN lacks:
      #
      #   default-branch head                                          -> allowed
      #   head of another branch, workflows differing from the default  -> allowed
      #   non-head commit whose workflows equal another branch head's   -> allowed
      #   commit merely missing a workflow file a branch head has       -> allowed
      #   non-head commit whose workflows match no branch head          -> REFUSED
      #
      # So the operative rule is "every workflow file this commit carries exists
      # byte-identical on some branch head"; deleting one does not count as modifying it.
      # Comparing against the default branch alone would be wrong — it would refuse the
      # ordinary release of a maintenance-branch tip, which GitHub allows. REST disguises
      # the refusal as HTTP 404; git push states it outright ("refusing to allow ... to
      # create or update workflow ... without `workflow` scope").
      #
      # Checked before the build and the publish, because the tagging step runs after the
      # artifacts are on Maven Central: failing there leaves a version published,
      # immutable and untagged, while failing here costs nothing. It runs under dry-run
      # too — it is read-only, and dry runs skip the tagging step itself, so this is the
      # only coverage the logic gets.
      - name: Fail early if the built commit cannot be tagged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          built_sha="$(git rev-parse HEAD)"
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          default_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq '.sha')"

          if [ "$built_sha" = "$default_head" ]; then
            echo "Built commit is the ${default_branch} head: the tag can be created."
            exit 0
          fi

          # One "name blob-sha" line per workflow file. Fail closed: only a confirmed 404
          # (no such directory at that ref) may be read as "no workflow files". Treating a
          # rate limit, 5xx or auth error as an empty list would wave through exactly the
          # release this step exists to stop. The directory listing is used rather than a
          # commit diff because the compare API caps `files` at 300 entries, which a wide
          # backport can exceed, hiding the one file that triggers the refusal.
          list_workflows() {
            local out rc=0
            out="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows?ref=$1" \
              --jq '[.[] | select(.type == "file") | .name + " " + .sha] | sort | .[]' 2>&1)" || rc=$?
            if [ "$rc" -eq 0 ]; then
              printf '%s\n' "$out"
              return 0
            fi
            if grep -qE 'HTTP 404|"status": ?"404"' <<<"$out"; then
              return 0
            fi
            printf '%s\n' "$out" >&2
            echo "::error title=Workflow listing failed::Could not list .github/workflows at $1, so whether ${built_sha} can be tagged is unknown. Refusing to start a release on unverified state; re-run when the API is reachable." >&2
            return 1
          }

          # Names of workflow files the built commit carries that the candidate does not
          # carry identically. Empty means the candidate covers the built commit.
          missing_against() {
            local candidate_list="$1" missing="" entry
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              grep -qxF -- "$entry" <<<"$candidate_list" || missing="${missing}${missing:+, }${entry%% *}"
            done <<<"$built_list"
            printf '%s' "$missing"
          }

          # Assign every lookup to a variable: a command substitution that fails inside an
          # argument list would not trip `set -e`, quietly restoring the fail-open bug.
          built_list="$(list_workflows "$built_sha")"
          default_list="$(list_workflows "$default_head")"
          blocking="$(missing_against "$default_list")"

          if [ -z "$blocking" ]; then
            echo "Workflow files at ${built_sha} are present unchanged on ${default_branch}: the tag can be created."
            exit 0
          fi

          # Any branch head will do. Fetch them once, failing closed: an unreadable branch
          # list must stop the release, not read as "no branch covers this commit".
          branch_lookup=0
          branch_heads_raw="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches" --jq '.[].commit.sha' 2>&1)" || branch_lookup=$?
          if [ "$branch_lookup" -ne 0 ]; then
            printf '%s\n' "$branch_heads_raw" >&2
            echo "::error title=Branch lookup failed::Could not list branches, so whether ${built_sha} can be tagged is unknown. Refusing to start a release on unverified state; re-run when the API is reachable." >&2
            exit 1
          fi
          branch_heads="$(sort -u <<<"$branch_heads_raw")"

          # A commit that IS a branch head has workflow files trivially identical to that
          # head's, so it is taggable. Checked before the scan below because it costs no
          # further API calls and is the ordinary maintenance-branch-tip release.
          if grep -qxF -- "$built_sha" <<<"$branch_heads"; then
            echo "Built commit is a branch head: the tag can be created."
            exit 0
          fi

          # The remaining question — does some OTHER branch head carry these same workflow
          # files — costs one call per branch, and only a real release needs the answer: a
          # dry run neither publishes nor tags, so it stops here rather than scanning. This
          # matters because the dry-run canary builds a pull-request merge commit, which
          # heads no branch, and would otherwise scan every branch on every run.
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::warning title=Built commit may not be taggable::${built_sha} carries workflow files (${blocking}) that are not on ${default_branch}, and it heads no branch. A REAL release would now scan the other branch heads for a match and refuse the release if none covered it. Skipped here because this is a dry run."
            exit 0
          fi

          while IFS= read -r branch_head; do
            [ -n "$branch_head" ] || continue
            [ "$branch_head" = "$default_head" ] && continue
            candidate_list="$(list_workflows "$branch_head")"
            if [ -z "$(missing_against "$candidate_list")" ]; then
              echo "Workflow files at ${built_sha} are present unchanged on branch head ${branch_head}: the tag can be created."
              exit 0
            fi
          done <<<"$branch_heads"

          echo "::error title=Built commit cannot be tagged::This release builds ${built_sha}, which carries workflow files (${blocking}) that exist on no branch head. GitHub refuses to point a tag at such a commit with the Actions GITHUB_TOKEN, so the release would publish and then fail untagged. Release a commit whose .github/workflows match a branch head, or give the release a token authorized to modify workflows." >&2
          exit 1

      # determine release version (for public flow)
      - name: Get latest tag
        if: inputs.flow-type == 'public'
        id: tag_version
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ github.repository }}
          regex: '^v([0-9]+)\..*'

      - name: Prepare new tag version
        if: inputs.flow-type == 'public'
        uses: actions-ecosystem/action-bump-semver@v1
        id: new-tag-version
        with:
          current_version: ${{ steps.tag_version.outputs.tag }}
          level: ${{ inputs.increment-version-level }}

      - name: Parse new version
        if: inputs.flow-type == 'public'
        id: new-version
        env:
          TAG_VALUE: ${{ steps.new-tag-version.outputs.new_version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${TAG_VALUE}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "The version must match the format 'v<major>.<minor>.<patch>' but it has value ${TAG_VALUE}" >&2
            exit 1
          fi

          {
            echo "group1=${BASH_REMATCH[1]}"
            echo "group2=${BASH_REMATCH[2]}"
            echo "group3=${BASH_REMATCH[3]}"
            echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          } >> "$GITHUB_OUTPUT"

      - name: Save new version to env
        if: inputs.flow-type == 'public'
        run: |
          echo "BUILD_VERSION=${{ steps.new-version.outputs.version }}" >> $GITHUB_ENV

      - name: Set up maven Central Repository
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          server-id: ossrh
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }} # gpg private key to import
          gpg-passphrase: GPG_PASSPHRASE # env variable for gpg signing in deploy

      - name: Set new version for maven
        run: mvn --batch-mode org.codehaus.mojo:versions-maven-plugin:2.13.0:set -DnewVersion=${{ env.BUILD_VERSION }}

      # The published pom.xml is the one `versions:set` rewrote, not the one in the tree,
      # and it is attached to the GitHub release. Hand it to the tagging job rather than
      # letting it re-checkout, which would attach the pre-release version.
      - name: Keep the released pom.xml for the release asset
        if: ${{ !inputs.dry-run }}
        uses: actions/upload-artifact@v4
        with:
          # Deliberately NOT keyed by run attempt. Recovery from a failed tagging step is
          # "re-run failed jobs", which does NOT re-run this publish job, so the tagging
          # job on attempt 2 must find the artifact uploaded on attempt 1. overwrite keeps
          # a full re-run — which does repeat this job — from colliding with itself.
          # Keyed by flow and version as well as run: one caller run can invoke this
          # workflow several times (a public and a hybrid release), and every call would
          # otherwise upload the same artifact name — with overwrite:true the later one
          # replaces the earlier, and a tagging job could attach the other release's pom.
          # Deliberately NOT keyed by run attempt: recovery re-runs only the tagging job,
          # which must find what this job uploaded on the earlier attempt.
          name: released-pom-${{ github.run_id }}-${{ inputs.flow-type }}-${{ env.BUILD_VERSION }}
          path: pom.xml
          # Long enough to cover a recovery days later, not just the same afternoon.
          retention-days: 7
          if-no-files-found: error
          overwrite: true

      - name: Publish to Sonatype Nexus
        if: ${{ !inputs.dry-run }}
        run: mvn --batch-mode deploy -P gpg ${{ inputs.release-mvn-parameters }}
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  # Tagging and release creation are a separate job deliberately. They run after the
  # artifacts are published, and publishing is irreversible: Maven Central refuses a
  # version that already exists. Were these steps in the publish job, GitHub's "re-run
  # failed jobs" would restart the publish and die there, so the recovery this job's own
  # error message describes could never be reached. Split, a re-run repeats only this
  # job — it finds the tag (created by hand if the refusal persists) and attaches the
  # release to it, while the successful publish stays untouched.
  #
  # No `environment:` here on purpose: this job needs only GITHUB_TOKEN, and inheriting
  # the publish job's environment would ask a protected environment to approve twice.
  tag-and-release:
    name: Tag and release
    if: ${{ !inputs.dry-run }}
    needs: prepare-build-publish-release
    runs-on: ubuntu-latest
    steps:
      # The pom.xml the publish job actually released, restored as the release asset.
      #
      # continue-on-error, and every use of the file below is guarded, because whether a
      # previous attempt's artifact is visible to a re-run of only the FAILED jobs is not
      # documented by either artifact action, and it could not be tested here: pushing a
      # probe workflow needs the `workflow` token scope that this whole change is about.
      # So the recovery path must not hinge on it. If the artifact is there the asset is
      # attached exactly as before; if it is not, the release is still created, tagged and
      # stamped — which is what registration depends on — and the missing asset is
      # reported rather than silently dropped.
      - name: Restore the released pom.xml
        id: restore-pom
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: released-pom-${{ github.run_id }}-${{ inputs.flow-type }}-${{ needs.prepare-build-publish-release.outputs.build-version }}
          # Into its own directory: at the workspace root a `-f pom.xml` probe could not
          # tell the released file from a checked-out one, and would silently attach the
          # pre-release version if a checkout is ever added to this job.
          path: released-pom

      # A flaky artifact service should cost a retry, not the asset. This is what makes the
      # step above best-effort rather than lax: the common failure it tolerates is transient,
      # and transient failures are retried here instead of degrading the release.
      #
      # It also hedges the one thing that could not be verified: whether download-artifact
      # sees an artifact uploaded by a job that did NOT re-run. This path asks
      # `GET /repos/{owner}/{repo}/actions/runs/{run_id}/artifacts`, which is scoped to the
      # RUN, so if the action turns out to be attempt-scoped the retry still finds it.
      - name: Retry restoring the released pom.xml
        if: ${{ steps.restore-pom.outcome == 'failure' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FLOW_TYPE: ${{ inputs.flow-type }}
          BUILD_VERSION: ${{ needs.prepare-build-publish-release.outputs.build-version }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            if gh run download "${GITHUB_RUN_ID}" \
                 --repo "${GITHUB_REPOSITORY}" \
                 --name "released-pom-${GITHUB_RUN_ID}-${FLOW_TYPE}-${BUILD_VERSION}" \
                 --dir released-pom; then
              echo "Restored the released pom.xml on retry ${attempt}."
              exit 0
            fi
            echo "Retry ${attempt} could not fetch the released pom.xml; waiting."
            sleep $(( attempt * 10 ))
          done
          echo "Could not fetch the released pom.xml after 3 retries." >&2

      # The tag is created at the commit the build job actually built. The replaced
      # action, marvinpinto/action-automatic-releases, had no target-commit input: it
      # tagged `context.sha`, which for the repository_dispatch runs every release uses
      # is the default-branch head at dispatch time, frozen for the run, regardless of
      # what was checked out. A hybrid release of anything other than the current tip
      # therefore tagged code that was never built.
      # This job otherwise has no checkout. The retry below is a script rather than an inline
      # loop so it can be tested (see .github/workflows/test-wait-for-tag-ref.yml), and a script
      # has to be fetched. Pinned to job.workflow_sha — the same commit as this workflow — so the
      # helper can never drift from the logic that calls it. Same mechanism the publish helper
      # already uses in the build job.
      - name: Resolve tag-wait helper ref
        id: tagwait-ref
        env:
          HELPER_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${HELPER_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Cannot pin the tag-wait helper::job.workflow_sha resolved to '${HELPER_SHA}', which is not a full commit SHA." >&2
            exit 1
          fi
          echo "sha=${HELPER_SHA}" >> "$GITHUB_OUTPUT"

      - name: Fetch tag-wait helper
        uses: actions/checkout@v4
        with:
          repository: octopusden/octopus-base
          ref: ${{ steps.tagwait-ref.outputs.sha }}
          path: .octopus-base-tagwait
          sparse-checkout: .github/scripts

      # The body of this step is `.github/scripts/tag-and-release.sh`, shared with the Gradle flow
      # and, later, with the #189 recovery. See the Gradle caller for why it is one script now.
      #
      # RELEASE_ASSET is what makes this flow take the draft-then-attach-then-publish path:
      # GitHub's immutable releases refuse an asset added after publication, so the pom.xml has
      # to be attached while the release is still a draft. The asset can never fail the job.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set for the same reason as in the Gradle flow: this job has no checkout, and
          # `gh release …` resolves the repository from the git remote.
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare-build-publish-release.outputs.build-version }}
          BUILT_SHA: ${{ needs.prepare-build-publish-release.outputs.built-sha }}
          RELEASE_ASSET: released-pom/pom.xml
        run: bash .octopus-base-tagwait/.github/scripts/tag-and-release.sh

      # Bind the release to the run that produced it. Registration happens afterwards
      # in a workflow_run context whose only trustworthy identity is this run's id and
      # attempt: a tag cannot say which release a run made when several releases share
      # a commit, and "the newest release" can move on while that job is queued. The
      # attempt is part of it because a rerun keeps the run id while the public flow
      # recomputes the version, so two releases would otherwise carry the same mark.
      # The marker is a delimited HTML comment: invisible in the rendered notes, and
      # not a prefix of another run's marker (555/1 vs 555/10).
      - name: Stamp the release with this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set for the same reason as above. This step only uses `gh api` with explicit
          # repository paths, so it does not need it today — but a future `gh release` call
          # added here would fail in a way that is hard to read.
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare-build-publish-release.outputs.build-version }}
          MARKER: "<!-- octopus-release-run: ${{ github.run_id }}/${{ github.run_attempt }} -->"
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')"
          body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.body // ""')"
          printf '%s\n\n%s\n' "$body" "$MARKER" > "$RUNNER_TEMP/release-body.md"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F body=@"$RUNNER_TEMP/release-body.md" --jq '.tag_name' > /dev/null
          echo "Release ${TAG} stamped with '${MARKER}'"

  register-release-in-log:
      # register release in octopus-release-log
      if: inputs.register-release-immediately && !inputs.dry-run
      # Both: the version comes from the build job, but the release must exist first.
      needs: [prepare-build-publish-release, tag-and-release]
      uses: ./.github/workflows/common-register-release.yml
      name: Register release
      with:
        octopus-repository: ${{ github.repository }}
        release-version: ${{ needs.prepare-build-publish-release.outputs.build-version }}
      secrets: inherit

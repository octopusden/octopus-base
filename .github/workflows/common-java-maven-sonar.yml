name: Maven Sonar

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version the project is built with. The analysis itself always runs on the scanner JDK below, because the scanner cannot load on Java 8.
        required: true
        type: string
      scanner-java-version:
        description: Java version the scanner runs on. SonarQube Cloud rejects analyses on a runtime below 21.
        required: false
        type: string
        default: '21'
      java-distribution:
        description: Java distribution passed to actions/setup-java
        required: false
        type: string
        default: temurin
      runs-on:
        description: GitHub runner label
        required: false
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Timeout in minutes for the analysis job
        required: false
        type: number
        default: 20
      sonar-host-url:
        description: Sonar server URL
        required: false
        type: string
        default: https://sonarcloud.io
      sonar-organization:
        description: Sonar organization key. Defaults to the GitHub owner.
        required: false
        type: string
        default: ''
      sonar-project-key:
        description: Sonar project key. Defaults to <owner>_<repo>.
        required: false
        type: string
        default: ''
      scanner-maven-plugin-version:
        description: Pinned sonar-maven-plugin version. Pinned rather than `mvn sonar:sonar`, which resolves the latest release and makes the build irreproducible.
        required: false
        type: string
        default: 5.7.0.6970
      mvn-parameters:
        description: Extra parameters for the build invocation
        required: false
        type: string
        default: ''
      quality-gate-wait:
        description: Fail the job when the quality gate is red
        required: false
        type: boolean
        default: true
      version-tag-regex:
        description: Regex selecting release tags. Must match the release workflow's.
        required: false
        type: string
        default: '^v([0-9]+)\..*'
      fallback-version:
        description: sonar.projectVersion for a repository that has no release tag yet
        required: false
        type: string
        default: '0.0.0'
      default-branch:
        description: Branch that non-default branches are compared against for new code. Empty means the repository's own default branch.
        required: false
        type: string
        default: ''
      continue-on-error:
        description: Report without failing the workflow
        required: false
        type: boolean
        default: false
    secrets:
      SONAR_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  sonar:
    name: sonar/analysis
    runs-on: ${{ inputs.runs-on }}
    continue-on-error: ${{ inputs.continue-on-error }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      # See the Gradle workflow for why this is load-bearing: Sonar derives the new-code period,
      # issue authorship and gate conditions from SCM blame, and a shallow clone gets all three
      # silently wrong rather than failing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Two JDKs, in this order. The scanner JDK is installed FIRST so that the build JDK ends up
      # as JAVA_HOME — setup-java points JAVA_HOME at whichever it installed last. The scanner
      # step then switches JAVA_HOME explicitly. Every Maven repository in this organisation that
      # holds code is on Java 8, where the scanner plugin cannot load at all, so this is the only
      # path rather than an edge case.
      - name: Set up scanner JDK
        id: scanner-jdk
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.scanner-java-version }}

      - name: Set up build JDK
        id: build-jdk
        uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}

      - name: Cache Sonar analyzers and provisioned JRE
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Find latest release tag
        id: latest-tag
        continue-on-error: true
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ github.repository }}
          regex: ${{ inputs.version-tag-regex }}

      - name: Resolve analysis parameters
        id: params
        shell: bash
        env:
          ORGANIZATION_INPUT: ${{ inputs.sonar-organization }}
          PROJECT_KEY_INPUT: ${{ inputs.sonar-project-key }}
          LATEST_TAG: ${{ steps.latest-tag.outputs.tag }}
          FALLBACK_VERSION: ${{ inputs.fallback-version }}
          DEFAULT_BRANCH_INPUT: ${{ inputs.default-branch }}
          REPO_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          repo_name="${GITHUB_REPOSITORY##*/}"
          owner="${GITHUB_REPOSITORY%%/*}"

          organization="${ORGANIZATION_INPUT:-$owner}"
          project_key="${PROJECT_KEY_INPUT:-${owner}_${repo_name}}"

          # The tag is passed through untouched: a version that never changes makes new code mean
          # everything forever, and one that changes every run makes an issue new code for exactly
          # one analysis. Both fail silently.
          version="${LATEST_TAG:-$FALLBACK_VERSION}"

          default_branch="${DEFAULT_BRANCH_INPUT:-${REPO_DEFAULT_BRANCH:-main}}"
          reference_branch=""
          if [[ "$EVENT_NAME" != "pull_request" && "$REF_NAME" != "$default_branch" ]]; then
            reference_branch="$default_branch"
          fi

          {
            echo "organization=${organization}"
            echo "project-key=${project_key}"
            echo "version=${version}"
            echo "reference-branch=${reference_branch}"
          } >> "$GITHUB_OUTPUT"

          echo "Analysing ${project_key} in ${organization} as version ${version}"
          if [[ -n "$reference_branch" ]]; then
            echo "New code on ${REF_NAME} is its diff against ${reference_branch}"
          fi

      # `-DskipTests` rather than `-Dmaven.test.skip`: the first skips test EXECUTION while still
      # compiling test sources, which Sonar analyses and wants bytecode for. The second would skip
      # compilation too. Nothing here consumes test results — coverage is out of scope and
      # sonar.junit.reportPaths is unset — and a flaky test should not redden a code analysis.
      # Reverse when coverage is wired up.
      - name: Build with the project JDK
        shell: bash
        env:
          JAVA_HOME: ${{ steps.build-jdk.outputs.path }}
          MVN_PARAMETERS: ${{ inputs.mvn-parameters }}
        run: |
          set -euo pipefail
          echo "Building with $("${JAVA_HOME}/bin/java" -version 2>&1 | head -1)"
          # shellcheck disable=SC2086 # mvn-parameters is a parameter list, splitting is the point
          mvn --batch-mode --update-snapshots package -DskipTests ${MVN_PARAMETERS:-}

      # A separate invocation on the scanner JDK, against the classes the previous step already
      # produced. `sonar.java.jdkHome` points the analyser back at the build JDK so it resolves
      # the project's real java.* classes rather than the scanner JDK's.
      - name: Run Sonar analysis on the scanner JDK
        shell: bash
        env:
          JAVA_HOME: ${{ steps.scanner-jdk.outputs.path }}
          BUILD_JAVA_HOME: ${{ steps.build-jdk.outputs.path }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
          SCANNER_VERSION: ${{ inputs.scanner-maven-plugin-version }}
          SONAR_ORGANIZATION: ${{ steps.params.outputs.organization }}
          SONAR_PROJECT_KEY: ${{ steps.params.outputs.project-key }}
          SONAR_PROJECT_VERSION: ${{ steps.params.outputs.version }}
          SONAR_REFERENCE_BRANCH: ${{ steps.params.outputs.reference-branch }}
          JAVA_SOURCE: ${{ inputs.java-version }}
          QUALITY_GATE_WAIT: ${{ inputs.quality-gate-wait }}
        run: |
          set -euo pipefail
          echo "Analysing with $("${JAVA_HOME}/bin/java" -version 2>&1 | head -1)"
          echo "Project bytecode targets Java ${JAVA_SOURCE} (jdkHome ${BUILD_JAVA_HOME})"

          reference_arg=()
          if [[ -n "${SONAR_REFERENCE_BRANCH}" ]]; then
            reference_arg=(-Dsonar.newCode.referenceBranch="${SONAR_REFERENCE_BRANCH}")
          fi

          mvn --batch-mode \
            "org.sonarsource.scanner.maven:sonar-maven-plugin:${SCANNER_VERSION}:sonar" \
            "${reference_arg[@]}" \
            -Dsonar.host.url="${SONAR_HOST_URL}" \
            -Dsonar.organization="${SONAR_ORGANIZATION}" \
            -Dsonar.projectKey="${SONAR_PROJECT_KEY}" \
            -Dsonar.projectVersion="${SONAR_PROJECT_VERSION}" \
            -Dsonar.java.jdkHome="${BUILD_JAVA_HOME}" \
            -Dsonar.java.source="${JAVA_SOURCE}" \
            -Dsonar.qualitygate.wait="${QUALITY_GATE_WAIT}"

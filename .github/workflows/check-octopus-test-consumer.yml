name: Merge Gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      octopus_base_ref:
        description: 'Optional tag, branch, or SHA to verify in octopus-test'
        required: false
        type: string
        default: ''
      octopus_test_base_ref:
        description: 'Base branch in octopus-test used for the verification branch'
        required: true
        type: string
        default: main
      verify_branch:
        description: 'Optional octopus-test branch name override'
        required: false
        type: string
        default: ''
      timeout_minutes:
        description: 'How long to wait for octopus-test build workflows'
        required: true
        type: number
        default: 30
      actionlint_image:
        description: 'Docker image (with tag) used for actionlint workflow linting'
        required: false
        type: string
        default: rhysd/actionlint:1.7.12

permissions:
  contents: read

jobs:
  # ---------- Required on every PR (standard taxonomy) ----------

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
        with:
          min-wrapper-count: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test plugin
        working-directory: gradle-quality-plugin
        run: ./gradlew build test --no-daemon --stacktrace

      # The preflight's Gradle half cannot be stubbed, and it is the half that decides
      # whether the check does anything at all: a silently empty coordinate file disables
      # the preflight without failing anything. Runs here rather than in workflow-lint
      # because this is the job that already has Java and Gradle. The fixture is this
      # repository's own plugin build, so the marker publication that java-gradle-plugin
      # creates in its own afterEvaluate is really exercised.
      - name: Publication listing against a real build
        shell: bash
        run: bash .github/scripts/test/list-publications-fixture.sh

      # Publishes to file:// repositories so the routing tasks really run. Neither a --dry-run nor
      # an `enabled` check would do: disabling a publish task leaves its dependencies on the graph,
      # which is how a signing task with no key reached a release and failed it after upload.
      - name: Publication routing against a real build
        shell: bash
        run: bash .github/scripts/test/publication-routing-fixture.sh

  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Static analysis and coverage gate
        working-directory: gradle-quality-plugin
        run: ./gradlew detekt ktlintCheck koverXmlReport koverVerify --no-daemon --stacktrace

  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    # `pull_request` triggers cannot supply inputs, so default explicitly.
    env:
      ACTIONLINT_IMAGE: ${{ inputs.actionlint_image || 'rhysd/actionlint:1.7.12' }}
    steps:
      - uses: actions/checkout@v4
      # Note on the last -ignore: `job.workflow_sha` is a documented job-context
      # property (the commit SHA of the workflow file defining the current job).
      # common-java-gradle-release.yml uses it to pin its helper script to its own
      # version. Every actionlint release up to the pinned 1.7.12 still ships an
      # older job-context type list and reports the property as undefined, so that
      # one message is filtered out. The workflow additionally refuses to run unless
      # the value is a full commit SHA, so the filter cannot hide a real breakage;
      # drop the -ignore once actionlint knows the property.
      - name: actionlint
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -lc '
            set -euo pipefail
            actionlint -color \
              -ignore "the runner of \".+\" action is too old to run on GitHub Actions" \
              -ignore "shellcheck reported issue in this script: SC2034:" \
              -ignore "shellcheck reported issue in this script: SC2046:" \
              -ignore "shellcheck reported issue in this script: SC2086:" \
              -ignore "property \"workflow_sha\" is not defined" \
              $(find .github/workflows -type f \( -name "*.yml" -o -name "*.yaml" \) | sort)
          '
      - name: Validate helper scripts
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find .github/scripts -type f -name '*.sh' | sort)
      - name: Validate workflow naming convention
        shell: bash
        run: bash .github/scripts/validate-workflow-naming.sh .
      # Exercises the Portal publish state machine against a stubbed Central API,
      # covering paths that cannot be triggered on demand against the live service
      # (FAILED validation, ambiguous publish responses, wrong deployment ids).
      - name: Portal publish helper scenarios
        shell: bash
        run: bash .github/scripts/test/portal-publish-scenarios.sh
      # Covers tag layouts that would otherwise need a crafted repository: several
      # version tags on one commit, and a higher unrelated tag elsewhere — the case
      # that once made a release register a version it never published.
      - name: Released-version resolution scenarios
        shell: bash
        run: bash .github/scripts/test/resolve-released-version-scenarios.sh
      # The preflight's contract is asymmetric and easy to break by accident: only a
      # fully published version may stop a release, and every inconclusive answer must
      # let it run. These scenarios pin both halves.
      - name: Central preflight scenarios
        shell: bash
        run: bash .github/scripts/test/central-preflight-scenarios.sh
      # The step body around the preflight: a coordinate listing that fails, stalls or
      # writes nothing must leave the release running and say so. Driven by a fake Gradle
      # wrapper, so those paths are reachable without a build.
      - name: Preflight step scenarios
        shell: bash
        run: bash .github/scripts/test/preflight-step-scenarios.sh
      # The publication guard decides what may reach an immutable public repository and had no
      # tests before the version refusal was added to it. Fixtures are local-repository trees, so
      # no Gradle is needed.
      - name: Publication set scenarios
        shell: bash
        run: bash .github/scripts/test/publication-set-scenarios.sh
      # The step AROUND the inspector: its fail-closed branch — the inspector missing from
      # disk — must stop a real release and only warn in a dry run, and nothing else reaches
      # it. The scenarios extract the step's own `run:` body from the workflow and drive it
      # with a stubbed gradlew, so that asymmetry cannot regress silently.
      - name: Publication guard step scenarios
        shell: bash
        run: bash .github/scripts/test/publication-guard-step-scenarios.sh
      # The retry around `mvn` lives in the workflow's own `run:` body, so these scenarios
      # extract that body and execute it against a stubbed mvn. Both halves are easy to break
      # silently: a transfer blip must cost a second attempt, and a compile error must not.
      - name: Maven build retry scenarios
        shell: bash
        run: bash .github/scripts/test/maven-build-retry-scenarios.sh

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate external action refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/validate-github-action-refs.sh "$GITHUB_WORKSPACE"

  # ---------- Producer-specific: octopus-test consumer canary ----------

  consumer-verify-scope:
    name: consumer-verify-scope
    runs-on: ubuntu-latest
    outputs:
      run_verify: ${{ steps.scope.outputs.run_verify }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve consumer canary scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          run_verify=true

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

            if grep -Eq '^(\.github/actions/|\.github/workflows/|\.github/scripts/update-octopus-test-refs\.sh$)' <<<"${changed_files}"; then
              run_verify=true
            else
              run_verify=false
            fi
          fi

          echo "run_verify=${run_verify}" >> "$GITHUB_OUTPUT"

          {
            echo "### consumer-verify scope"
            echo "- run: \`${run_verify}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  consumer-verify:
    name: consumer-verify
    needs: consumer-verify-scope
    uses: ./.github/workflows/verify-octopus-test-consumer.yml
    with:
      enabled: ${{ needs.consumer-verify-scope.outputs.run_verify == 'true' }}
      octopus_base_ref: ${{ inputs.octopus_base_ref || (github.event_name == 'pull_request' && github.event.pull_request.head.sha || '') }}
      octopus_test_base_ref: ${{ inputs.octopus_test_base_ref || 'main' }}
      verify_branch: ${{ inputs.verify_branch || (github.event_name == 'pull_request' && format('verify/octopus-base-pr-{0}', github.event.pull_request.number) || '') }}
      timeout_minutes: ${{ inputs.timeout_minutes || 30 }}
    secrets:
      octopus_test_push_token: ${{ secrets.OCTOPUS_TEST_PUSH_TOKEN }}

  # ---------- Aggregate ----------

  gate-merge:
    name: gate/merge
    if: ${{ always() }}
    needs:
      - build
      - quality
      - workflow-lint
      - security
      - consumer-verify
    runs-on: ubuntu-latest
    steps:
      - name: Validate gate results
        shell: bash
        run: |
          set -euo pipefail

          results='${{ toJson(needs) }}'
          failed="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"${results}")"

          {
            echo "### Merge gate results"
            jq -r 'to_entries[] | "- \(.key): \(.value.result)"' <<<"${results}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ -n "${failed}" ]]; then
            echo "Merge gate failed:"
            echo "${failed}"
            exit 1
          fi

          echo "Merge gate passed."

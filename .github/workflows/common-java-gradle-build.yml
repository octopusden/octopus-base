# This is a basic build workflow for Octopus gradle Java modules
name: Gradle Compile & UT

on:
  workflow_call:
    inputs:
      flow-type:
        required: true
        type: string # one of { public, hybrid }
      java-version:
        required: true
        type: string
      docker-image:
        required: false
        type: string
        default: ''
      skip-tests:
        required: false
        type: boolean
        default: true
      resolve-from-shared-packages:
        description: 'Export OCTOPUS_SHARED_PACKAGES_READ_TOKEN to Gradle as SHARED_PACKAGES_READ_USERNAME/SHARED_PACKAGES_READ_TOKEN, for a build that resolves dependencies from octopusden/octopus-maven-packages. The job fails early if the secret did not reach it. Off by default: the token reaches no Gradle step of a repository that does not ask for it, and the two variables stay unset.'
        required: false
        type: boolean
        default: false
    secrets:
      OCTOPUS_SHARED_PACKAGES_READ_TOKEN:
        description: 'Classic PAT with read:packages only, for resolving from octopusden/octopus-maven-packages. A repository secret, since octopusden is a user account with no organization secrets. Read only when resolve-from-shared-packages is set.'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Prod
    env:
      SKIP_TESTS: '' # run tests for public flow only
      BUILD_VERSION: 1.0-SNAPSHOT # dummy version which is not really used

    steps:
      - name: Public flow
        if: inputs.flow-type == 'public'
        run: |
          echo "Public flow, run with tests"

      - name: Hybrid flow
        if: inputs.flow-type == 'hybrid' && inputs.skip-tests
        run: |
          echo "Hybrid flow, skip tests"
          echo "SKIP_TESTS=-x test" >> $GITHUB_ENV

      - name: Unknown flow
        if: inputs.flow-type != 'public' && inputs.flow-type != 'hybrid'
        run: |
          echo "Unknown flow specified, should be one of {public, hybrid}: " ${{ inputs.flow-type }}
          exit 1

      # GitHub Packages authenticates every read, so a dependency from the shared registry needs a
      # credential. Exported only when the caller opts in, and under names of its own: the release's
      # GitHub Packages publish step sets GITHUB_PACKAGES_*, which follow the publish destination.
      - name: Shared packages credentials
        if: ${{ inputs.resolve-from-shared-packages }}
        env:
          READ_TOKEN: ${{ secrets.OCTOPUS_SHARED_PACKAGES_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo "::error title=No token for the shared packages registry::resolve-from-shared-packages is set, but OCTOPUS_SHARED_PACKAGES_READ_TOKEN did not reach this job. Store it as a repository secret (a classic PAT with read:packages only, outside any environment) and pass 'secrets: inherit' on the calling job." >&2
            exit 1
          fi
          echo "SHARED_PACKAGES_READ_USERNAME=$GITHUB_REPOSITORY_OWNER" >> "$GITHUB_ENV"
          echo "SHARED_PACKAGES_READ_TOKEN=$READ_TOKEN" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Gradle build
        if: inputs.docker-image == ''
        run: ./gradlew build ${{ env.SKIP_TESTS }} -PbuildVersion=${{ env.BUILD_VERSION }} -Pversion=${{ env.BUILD_VERSION }} --info -s

      - name: Gradle build docker image
        if: inputs.docker-image
        run: ./gradlew build dockerBuildImage ${{ env.SKIP_TESTS }} -Poctopus.github.docker.registry=ghcr.io -Pdocker.registry=docker.io -PbuildVersion=${{ env.BUILD_VERSION }} -Pversion=${{ env.BUILD_VERSION }} --info -s

name: Gradle Dependency Submission

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK used to resolve the consumer's Gradle dependencies
        required: true
        type: string

permissions:
  contents: write

jobs:
  dependency-submission:
    name: dependency-submission
    # Resolve trusted default-branch code only. Never grant a PR's Gradle scripts this token.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: Resolve and submit dependency graph
        uses: gradle/actions/dependency-submission@v5
        with:
          validate-wrappers: true
          dependency-graph: generate-submit-and-upload
          dependency-graph-continue-on-failure: false

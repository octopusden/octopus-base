name: Release octopus-base

on:
  workflow_dispatch:
    inputs:
      increment-version-level:
        description: 'One of: {major, minor, patch}'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      target-ref:
        description: 'Branch to release (commit SHA allowed only with dry-run)'
        required: true
        type: string
        default: main
      dry-run:
        description: 'Validate and calculate version without creating a release'
        required: true
        type: boolean
        default: false
      verify_octopus_test:
        description: 'Run octopus-test consumer verification before creating the release'
        required: true
        type: boolean
        default: false
      resume-deployment-id:
        description: 'Emergency re-run knob: Portal deployment id of a release whose artifacts were already uploaded (printed by the failed run as RELEASE_PUBLISH_RESUME_DEPLOYMENT_ID). When set, the Gradle upload is SKIPPED and that deployment is published instead — prevents uploading the same version twice.'
        required: false
        type: string
        default: ''

permissions:
  contents: write

# Never let two self-releases overlap: both would compute the same version and
# upload it twice. Queue instead of cancelling — a cancelled run can leave an
# unpublished deployment behind.
concurrency:
  group: release-octopus-base
  cancel-in-progress: false

jobs:
  flags:
    name: Normalise inputs
    runs-on: ubuntu-latest
    outputs:
      dry-run: ${{ steps.normalise.outputs.dry-run }}
      verify-octopus-test: ${{ steps.normalise.outputs.verify-octopus-test }}
    steps:
      # A workflow_dispatch boolean arrives as a real boolean from the UI but as a
      # string from the API, and the two behave differently in an if: expression: the
      # string "false" is non-empty and therefore truthy, so `!inputs.dry-run` was false
      # and a real release triggered with `gh workflow run -f dry-run=false` skipped its
      # publish without a word. Comparing against 'true' instead is not a fix either —
      # a UI dry-run passes the boolean true, and `true != 'true'` is true, which would
      # publish during a dry run.
      #
      # Both representations stringify identically in env, so the decision is made once,
      # here, and every job compares a plain string. An unexpected value stops the run
      # rather than being guessed at.
      - name: Normalise boolean inputs
        id: normalise
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          VERIFY_OCTOPUS_TEST: ${{ inputs.verify_octopus_test }}
        shell: bash
        run: |
          set -euo pipefail
          normalise() { # name value
            case "$2" in
              true|false) echo "$1=$2" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "::error title=Unusable input::${1} arrived as '${2}', which is neither true nor false."
                exit 1
                ;;
            esac
          }
          normalise dry-run "$DRY_RUN"
          normalise verify-octopus-test "$VERIFY_OCTOPUS_TEST"
          {
            echo "### Normalised inputs"
            echo "- dry-run: \`${DRY_RUN}\` -> \`$(grep '^dry-run=' "$GITHUB_OUTPUT" | tail -1 | cut -d= -f2)\`"
            echo "- verify-octopus-test: \`${VERIFY_OCTOPUS_TEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  resolve-target:
    name: Resolve target ref
    needs: flags
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.resolve.outputs.target_sha }}

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.target-ref }}

      - name: Resolve target SHA and branch
        id: resolve
        env:
          INPUT_TARGET_REF: ${{ inputs.target-ref }}
          INPUT_DRY_RUN: ${{ needs.flags.outputs.dry-run }}
        shell: bash
        run: |
          set -euo pipefail

          target_sha="$(git rev-parse HEAD)"
          target_branch=""

          if [[ "$INPUT_TARGET_REF" == refs/heads/* ]]; then
            target_branch="${INPUT_TARGET_REF#refs/heads/}"
          elif git show-ref --verify --quiet "refs/remotes/origin/$INPUT_TARGET_REF"; then
            target_branch="$INPUT_TARGET_REF"
          fi

          if [[ "${INPUT_DRY_RUN}" != "true" && -z "${target_branch}" ]]; then
            echo "target-ref '${INPUT_TARGET_REF}' is not a branch." >&2
            echo "Non-dry-run releases must target a branch that exists on origin." >&2
            exit 1
          fi

          {
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"

  verify-octopus-test:
    needs:
      - flags
      - resolve-target
    if: ${{ needs.flags.outputs.verify-octopus-test == 'true' }}
    name: Verify octopus-test consumer
    uses: ./.github/workflows/verify-octopus-test-consumer.yml
    with:
      octopus_base_ref: ${{ needs.resolve-target.outputs.target_sha }}
    secrets:
      octopus_test_push_token: ${{ secrets.OCTOPUS_TEST_PUSH_TOKEN }}

  calculate-version:
    name: Calculate release version
    needs:
      - flags
      - resolve-target
      - verify-octopus-test
    # always() is needed because the verification job is skipped when it was not asked
    # for — but it also lets this job run after a *failed* dependency, which is how a
    # rejected target-ref still produced a computed version from an unintended checkout.
    # So every dependency that must have succeeded is named explicitly, and an empty
    # flags output can no longer read as "verification was not requested".
    if: ${{ always() && needs.flags.result == 'success' && needs.resolve-target.result == 'success' && (needs.flags.outputs.verify-octopus-test != 'true' || needs.verify-octopus-test.result == 'success') }}
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      next_tag: ${{ steps.version.outputs.next_tag }}
      latest_tag: ${{ steps.version.outputs.latest_tag }}
      target_sha: ${{ steps.version.outputs.target_sha }}

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-target.outputs.target_sha }}

      - name: Calculate next version
        id: version
        env:
          INCREMENT_LEVEL: ${{ inputs.increment-version-level }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags --force

          latest_tag=$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)
          if [[ -z "$latest_tag" ]]; then
            latest_tag="v0.0.0"
          fi

          if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Latest tag '$latest_tag' has unsupported format. Expected vX.Y.Z"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"

          case "$INCREMENT_LEVEL" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported increment level '$INCREMENT_LEVEL'"
              exit 1
              ;;
          esac

          next_tag="v${major}.${minor}.${patch}"
          target_sha=$(git rev-parse HEAD)

          {
            echo "latest_tag=$latest_tag"
            echo "next_tag=$next_tag"
            echo "release_version=${major}.${minor}.${patch}"
            echo "target_sha=$target_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Ensure target tag does not exist
        shell: bash
        run: |
          set -euo pipefail

          next_tag="${{ steps.version.outputs.next_tag }}"
          if git ls-remote --tags origin "refs/tags/$next_tag" | grep -q .; then
            echo "Tag '$next_tag' already exists on origin"
            exit 1
          fi

      - name: Dry run summary
        if: ${{ needs.flags.outputs.dry-run == 'true' }}
        shell: bash
        run: |
          echo "Dry run enabled: no GitHub Release will be created."
          echo "Calculated tag: ${{ steps.version.outputs.next_tag }}"

  publish-quality-plugin:
    name: Publish quality convention plugin
    needs:
      - flags
      - calculate-version
    if: ${{ needs.flags.outputs.dry-run != 'true' }}
    runs-on: ubuntu-latest
    environment: Prod

    steps:
      - name: Checkout target SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.calculate-version.outputs.target_sha }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
        with:
          min-wrapper-count: 0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Bind stagingProfileId to the gradle-nexus sonatype repository so publishing
      # bypasses the flaky OSSRH-compat staging-profile auto-lookup (same fix as the
      # reusable release workflow). Consumer build needs no change.
      - name: Prepare staging-profile init script
        if: ${{ inputs.resume-deployment-id == '' }}
        run: |
          cat > "$RUNNER_TEMP/staging-profile.init.gradle" <<'GRADLE'
          allprojects { proj ->
              proj.plugins.withId('io.github.gradle-nexus.publish-plugin') {
                  def spid = proj.findProperty('stagingProfileId')?.toString()?.trim()
                  if (spid) {
                      proj.extensions.getByName('nexusPublishing')
                          .repositories.all { repo -> if (repo.name == 'sonatype') repo.stagingProfileId.set(spid) }
                  }
              }
          }
          GRADLE
          echo "Wrote $RUNNER_TEMP/staging-profile.init.gradle"

      # Upload + close only. The Nexus2-compat `release` transition leaves the
      # deployment `closed` (nothing reaches Central), so the publish is driven
      # explicitly through the Central Portal API in the next step.
      - name: Build and publish plugin
        id: publish-sonatype
        if: ${{ inputs.resume-deployment-id == '' }}
        working-directory: gradle-quality-plugin
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -o pipefail
          ./gradlew build publishToSonatype closeSonatypeStagingRepository \
            -Pversion=${{ needs.calculate-version.outputs.release_version }} \
            -Pnexus=true \
            -PstagingProfileId=org.octopusden \
            --init-script "$RUNNER_TEMP/staging-profile.init.gradle" \
            --no-daemon --info -s 2>&1 | tee "$RUNNER_TEMP/publish.log"

      # Explicit Central Portal publish + verification that the plugin is really
      # resolvable on Maven Central. REQUIRE_COORDS pins the plugin marker POM —
      # that is what every consumer's plugin resolution hits first, so the release
      # must not be tagged unless the marker is live (see #158).
      - name: Publish deployment via Central Portal
        id: portal-publish
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          BUILD_VERSION: ${{ needs.calculate-version.outputs.release_version }}
          STAGING_PROFILE_ID: org.octopusden
          PUBLISH_LOG: ${{ runner.temp }}/publish.log
          RESUME_DEPLOYMENT_ID: ${{ inputs.resume-deployment-id }}
          REQUIRE_COORDS: 'org.octopusden.octopus-quality:org.octopusden.octopus-quality.gradle.plugin'
        run: bash .github/scripts/portal-publish.sh

      # If the Gradle upload/close failed after the staging repository was created,
      # the artifacts already exist and a plain re-run would upload this version
      # twice. The Portal helper classifies its own failures; this covers the
      # Gradle stage, which has no diagnose step here.
      - name: Report resumable publish failure
        if: ${{ failure() && steps.publish-sonatype.outcome == 'failure' }}
        env:
          RELEASE_VERSION: ${{ needs.calculate-version.outputs.release_version }}
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        run: |
          set +e
          log="$RUNNER_TEMP/publish.log"
          repo=$(grep -oE "Created staging repository '[^']+'" "$log" 2>/dev/null | head -1 | sed -E "s/^.*'([^']+)'.*$/\1/")
          if [ -n "$repo" ]; then
            echo "RELEASE_PUBLISH_CLASS=resumable"
            echo "RELEASE_PUBLISH_RETRYABLE=false"
            echo "RELEASE_PUBLISH_COMPAT_KEY=$repo"
            # Resolve the Portal deployment id too, so the operator can resume
            # directly instead of looking it up by hand.
            auth="Authorization: Bearer $(printf '%s' "${MAVEN_USERNAME}:${MAVEN_PASSWORD}" | base64 | tr -d '\n')"
            sf="$RUNNER_TEMP/diag-search.json"
            scode=$(curl -sS --connect-timeout 15 --max-time 60 -o "$sf" -w '%{http_code}' \
              -H "$auth" -H 'Accept: application/json' \
              "https://ossrh-staging-api.central.sonatype.com/manual/search/repositories?ip=any&profile_id=org.octopusden" 2>/dev/null)
            did=$(jq -r --arg k "$repo" '.repositories[]? | select(.key | endswith($k)) | .portal_deployment_id // empty' "$sf" 2>/dev/null | head -1)
            echo "GET /manual/search/repositories -> HTTP ${scode:-?}"
            if [ -n "$did" ] && [ "$did" != "null" ]; then
              echo "RELEASE_PUBLISH_RESUME_DEPLOYMENT_ID=$did"
              echo "::error title=Resumable publish failure::${RELEASE_VERSION} is already staged as ${repo} (Portal deployment ${did}). Do NOT plainly re-run — that uploads the version twice. Re-dispatch this workflow with resume-deployment-id=${did}."
            else
              echo "::error title=Resumable publish failure::${RELEASE_VERSION} is already staged as ${repo}, but no Portal deployment is mapped to it yet. Do NOT plainly re-run — that uploads the version twice. Re-check the Compat/Portal state and resume with resume-deployment-id once the id appears, or drop that staging repository first."
            fi
          else
            echo "RELEASE_PUBLISH_CLASS=unknown"
            echo "RELEASE_PUBLISH_RETRYABLE=unknown"
            echo "::warning title=Publish failed, staging state unknown::Staging repository could not be identified from the log, which does NOT prove the remote create/upload failed. A plain re-dispatch is not proven safe: inspect the Compat/Portal state for ${RELEASE_VERSION} first."
          fi

  create-release:
    name: Create GitHub release
    needs:
      - flags
      - calculate-version
      - publish-quality-plugin
    if: ${{ needs.flags.outputs.dry-run != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create \
            "${{ needs.calculate-version.outputs.next_tag }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.calculate-version.outputs.release_version }}" \
            --target "${{ needs.calculate-version.outputs.target_sha }}" \
            --generate-notes \
            --notes-start-tag "${{ needs.calculate-version.outputs.latest_tag }}"

      - name: Print release details
        shell: bash
        run: |
          echo "Release created:"
          echo "- From tag: ${{ needs.calculate-version.outputs.latest_tag }}"
          echo "- To tag: ${{ needs.calculate-version.outputs.next_tag }}"
          echo "- Target SHA: ${{ needs.calculate-version.outputs.target_sha }}"

  register-release-in-log:
    if: ${{ needs.flags.outputs.dry-run != 'true' }}
    needs:
      - flags
      - calculate-version
      - create-release
    uses: ./.github/workflows/common-register-release.yml
    name: Register release
    with:
      octopus-repository: ${{ github.repository }}
      release-version: ${{ needs.calculate-version.outputs.release_version }}
    secrets: inherit

name: KTS Compile Check

# Checks the TeamCity Kotlin scripts on the exact toolchain they run on
# (kotlin-compiler 1.5.32), so breakage is caught in CI instead of at release time
# on a TeamCity agent. Two separate classes are covered:
#   * compile errors, including ones only this compiler rejects (a .main.kts-only
#     smart-cast failure once shipped this way);
#   * runtime failures on the first HTTP request — the agents' JDK is not uniform,
#     and a library that reflects into java.net internals compiles fine yet dies
#     instantly on JDK 17+. Compiling alone cannot see that, so the smoke step
#     actually drives a request.
# The matrix mirrors the JDKs the release configurations really use.
on:
  pull_request:
    paths:
      - 'teamcity/scripts/**.main.kts'
      - '.github/scripts/test/teamcity-poller-smoke.sh'
      - '.github/workflows/kts-compile-check.yml'
  workflow_dispatch: {}

jobs:
  compile-kts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 8 is what most release configurations run today; 21 is what the rest run,
        # and where JDK strong encapsulation applies.
        java-version: ['8', '21']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Install Kotlin compiler 1.5.32
        run: |
          set -euo pipefail
          curl -sSL --retry 3 --retry-delay 5 -o /tmp/kotlin.zip \
            https://github.com/JetBrains/kotlin/releases/download/v1.5.32/kotlin-compiler-1.5.32.zip
          unzip -q /tmp/kotlin.zip -d "$HOME"

      - name: Compile teamcity/scripts/*.main.kts
        run: |
          set -uo pipefail
          KOTLINC="$HOME/kotlinc/bin/kotlinc"
          MAIN_KTS_JAR="$HOME/kotlinc/lib/kotlin-main-kts.jar"
          shopt -s nullglob
          scripts=(teamcity/scripts/*.main.kts)
          if [ ${#scripts[@]} -eq 0 ]; then
            echo "::error::No teamcity/scripts/*.main.kts found; the check would pass vacuously."
            exit 1
          fi
          rc=0
          for s in "${scripts[@]}"; do
            echo "::group::compile $s"
            # kotlinc compiles the whole script before running it; with no arguments
            # the script's own argument guard exits before any side effect, so this
            # is a safe compile check.
            out="$("$KOTLINC" -cp "$MAIN_KTS_JAR" -script "$s" 2>&1 || true)"
            echo "$out"
            echo "::endgroup::"
            if printf '%s\n' "$out" | grep -q "error:"; then
              echo "::error file=$s::Kotlin compile error in $s"
              rc=1
            # A compiler that cannot even start (an unsupported JDK, for instance)
            # prints no 'error:' line at all, so require evidence the script ran.
            elif ! printf '%s\n' "$out" | grep -q "Arguments:"; then
              echo "::error file=$s::$s compiled but never reached its argument guard"
              rc=1
            else
              echo "OK: $s compiles and starts"
            fi
          done
          exit $rc

      - name: Smoke-test the release poller's HTTP client
        run: bash .github/scripts/test/teamcity-poller-smoke.sh

# This is a basic build workflow for Octopus gradle Java modules
name: Gradle Compile & UT

on:
  workflow_call:
    inputs:
      flow-type:
        required: true
        type: string # one of { public, hybrid }
      java-version:
        required: true
        type: string
      docker-image:
        required: false
        type: string
        default: ''
      skip-tests:
        required: false
        type: boolean
        default: true
    secrets:
      OCTOPUS_SHARED_PACKAGES_TOKEN:
        description: 'Token with read:packages on octopusden/octopus-maven-packages, exported as GITHUB_PACKAGES_USERNAME/GITHUB_PACKAGES_TOKEN for a build that resolves dependencies from that registry. Optional: unset, both are empty and nothing changes.'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Prod
    env:
      SKIP_TESTS: '' # run tests for public flow only
      BUILD_VERSION: 1.0-SNAPSHOT # dummy version which is not really used
      # GitHub Packages authenticates every read, so a dependency from the shared registry needs
      # a credential; the build script reads these two names.
      GITHUB_PACKAGES_USERNAME: ${{ github.repository_owner }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.OCTOPUS_SHARED_PACKAGES_TOKEN }}

    steps:
      - name: Public flow
        if: inputs.flow-type == 'public'
        run: |
          echo "Public flow, run with tests"

      - name: Hybrid flow
        if: inputs.flow-type == 'hybrid' && inputs.skip-tests
        run: |
          echo "Hybrid flow, skip tests"
          echo "SKIP_TESTS=-x test" >> $GITHUB_ENV

      - name: Unknown flow
        if: inputs.flow-type != 'public' && inputs.flow-type != 'hybrid'
        run: |
          echo "Unknown flow specified, should be one of {public, hybrid}: " ${{ inputs.flow-type }}
          exit 1

      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Gradle build
        if: inputs.docker-image == ''
        run: ./gradlew build ${{ env.SKIP_TESTS }} -PbuildVersion=${{ env.BUILD_VERSION }} -Pversion=${{ env.BUILD_VERSION }} --info -s

      - name: Gradle build docker image
        if: inputs.docker-image
        run: ./gradlew build dockerBuildImage ${{ env.SKIP_TESTS }} -Poctopus.github.docker.registry=ghcr.io -Pdocker.registry=docker.io -PbuildVersion=${{ env.BUILD_VERSION }} -Pversion=${{ env.BUILD_VERSION }} --info -s

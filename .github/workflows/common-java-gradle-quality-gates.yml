name: Gradle Quality Gates

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version used for quality checks
        required: true
        type: string
      java-distribution:
        description: Java distribution passed to actions/setup-java
        required: false
        type: string
        default: temurin
      runs-on:
        description: GitHub runner label
        required: false
        type: string
        default: ubuntu-24.04
      timeout-minutes:
        description: Timeout in minutes for every quality job
        required: false
        type: number
        default: 20
      enable-wrapper-validation:
        description: Run Gradle wrapper checksum validation before quality jobs
        required: false
        type: boolean
        default: true
      static-command:
        description: Command for static quality checks
        required: false
        type: string
        default: ./gradlew qualityStatic --no-daemon --stacktrace
      coverage-command:
        description: Command for tests and coverage quality checks
        required: false
        type: string
        default: ./gradlew qualityCoverage --no-daemon --stacktrace
      static-reports-path:
        description: Multiline glob with static quality reports
        required: false
        type: string
        default: |
          **/build/reports/checkstyle/**
          **/build/reports/pmd/**
          **/build/reports/spotbugs/**
          **/build/reports/codenarc/**
          **/build/reports/detekt/**
          **/build/reports/ktlint/**
      coverage-reports-path:
        description: Multiline glob with test and coverage reports
        required: false
        type: string
        default: |
          **/build/reports/kover/**
          **/build/reports/jacoco/**
          **/build/reports/tests/**
          **/build/test-results/**
      resolve-from-shared-packages:
        description: 'Export OCTOPUS_SHARED_PACKAGES_READ_TOKEN to Gradle as SHARED_PACKAGES_READ_USERNAME/SHARED_PACKAGES_READ_TOKEN, for a build that resolves dependencies from octopusden/octopus-maven-packages. The job fails early if the secret did not reach it. Off by default: the token reaches no Gradle step of a repository that does not ask for it, and the two variables stay unset.'
        required: false
        type: boolean
        default: false
    secrets:
      OCTOPUS_SHARED_PACKAGES_READ_TOKEN:
        description: 'Classic PAT with read:packages only, for resolving from octopusden/octopus-maven-packages. A repository secret, since octopusden is a user account with no organization secrets. Read only when resolve-from-shared-packages is set.'
        required: false

permissions:
  contents: read

jobs:
  wrapper-validation:
    name: quality/wrapper-validation
    if: ${{ inputs.enable-wrapper-validation }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

  static:
    name: quality/static
    needs: wrapper-validation
    if: ${{ always() && ( !inputs.enable-wrapper-validation || needs.wrapper-validation.result == 'success' ) }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      # GitHub Packages authenticates every read, so a dependency from the shared registry needs a
      # credential. Exported only when the caller opts in, and under names of its own: the release's
      # GitHub Packages publish step sets GITHUB_PACKAGES_*, which follow the publish destination.
      - name: Shared packages credentials
        if: ${{ inputs.resolve-from-shared-packages }}
        env:
          READ_TOKEN: ${{ secrets.OCTOPUS_SHARED_PACKAGES_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo "::error title=No token for the shared packages registry::resolve-from-shared-packages is set, but OCTOPUS_SHARED_PACKAGES_READ_TOKEN did not reach this job. Store it as a repository secret (a classic PAT with read:packages only, outside any environment) and pass 'secrets: inherit' on the calling job. A pull request from a fork never gets it, and one opened by Dependabot gets Dependabot secrets only: store a Dependabot secret of the same name too." >&2
            exit 1
          fi
          echo "SHARED_PACKAGES_READ_USERNAME=$GITHUB_REPOSITORY_OWNER" >> "$GITHUB_ENV"
          echo "SHARED_PACKAGES_READ_TOKEN=$READ_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run static checks
        run: ${{ inputs.static-command }}
      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: ${{ inputs.static-reports-path }}
          if-no-files-found: warn

  tests-coverage:
    name: quality/tests-coverage
    needs: wrapper-validation
    if: ${{ always() && ( !inputs.enable-wrapper-validation || needs.wrapper-validation.result == 'success' ) }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Shared packages credentials
        if: ${{ inputs.resolve-from-shared-packages }}
        env:
          READ_TOKEN: ${{ secrets.OCTOPUS_SHARED_PACKAGES_READ_TOKEN }}
        run: |
          if [ -z "$READ_TOKEN" ]; then
            echo "::error title=No token for the shared packages registry::resolve-from-shared-packages is set, but OCTOPUS_SHARED_PACKAGES_READ_TOKEN did not reach this job. Store it as a repository secret (a classic PAT with read:packages only, outside any environment) and pass 'secrets: inherit' on the calling job. A pull request from a fork never gets it, and one opened by Dependabot gets Dependabot secrets only: store a Dependabot secret of the same name too." >&2
            exit 1
          fi
          echo "SHARED_PACKAGES_READ_USERNAME=$GITHUB_REPOSITORY_OWNER" >> "$GITHUB_ENV"
          echo "SHARED_PACKAGES_READ_TOKEN=$READ_TOKEN" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests and coverage verification
        run: ${{ inputs.coverage-command }}
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: ${{ inputs.coverage-reports-path }}
          if-no-files-found: warn

group=org.octopusden.octopus
version=0.1.0-SNAPSHOT

# Quality tool versions — pinned for reproducibility
detektVersion=1.23.8
ktlintGradleVersion=14.0.1
koverVersion=0.9.4
spotbugsGradleVersion=6.0.26
# SpotBugs analysis engine (toolVersion). 4.9.x ships ASM 9.9 / BCEL 6.11, required to read
# Java 25 bytecode (class file v69); the plugin default (4.8.x) aborts on v69.
spotbugsVersion=4.9.8
# ErrorProne: Gradle plugin + analysis engine, split like SpotBugs (plugin vs toolVersion).
# The engine is the DEFAULT only — consumers override it with `java { errorProneVersion }`, because
# no single release spans the org's JDK range (2.31.0 runs on 11-21 and crashes on 25; 2.50.0 needs
# 21+). 2.31.0 is the LAST Java 11 bytecode release — 2.32.0 already requires 17 — so it holds the
# documented JDK 11 floor and can be executed by this plugin's own tests, which run on that toolchain.
errorproneGradleVersion=5.1.1
errorproneVersion=2.31.0
kotlinGradlePluginVersion=1.9.25
checkstyleVersion=10.17.0
pmdVersion=6.55.0

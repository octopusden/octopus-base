# Base action for registering octopus releases in the release-log
name: Register Release

on:
  workflow_call:
    inputs:
      octopus-repository:
        type: string
        required: true
      release-version:
        type: string
        required: true
      # Owner/repo of the release-log repository the dispatch is posted to. Constrained
      # to a github.com path — accepting an arbitrary URL would let a caller redirect the
      # bearer token to a non-GitHub host, so we construct the URL ourselves below.
      release-log-repository:
        type: string
        required: false
        default: octopusden/octopus-release-log
      github-api-version:
        type: string
        required: false
        default: '2022-11-28'

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Prod
    env:
      OCTOPUS_MODULE_NAME: ''

    steps:
      - name: Set module name
        id: set-module-name
        env:
          OCTOPUS_REPOSITORY: ${{ inputs.octopus-repository }}
        run: |
          set -euo pipefail
          echo "OCTOPUS_MODULE_NAME=${OCTOPUS_REPOSITORY##*/}" >> "$GITHUB_ENV"

      # This workflow runs against the caller's checkout, which has no copy of the
      # helper, so it is fetched from the pinned version of this workflow. A full
      # commit SHA is required: an empty or non-SHA ref would make actions/checkout
      # silently fall back to a default branch and run a different script version.
      - name: Resolve release-log helper ref
        id: helper-ref
        env:
          HELPER_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${HELPER_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Cannot pin the release-log helper::job.workflow_sha resolved to '${HELPER_SHA}', which is not a full commit SHA. Refusing to run an unpinned helper."
            exit 1
          fi
          echo "sha=${HELPER_SHA}" >> "$GITHUB_OUTPUT"

      - name: Fetch release-log helper
        uses: actions/checkout@v4
        with:
          repository: octopusden/octopus-base
          ref: ${{ steps.helper-ref.outputs.sha }}
          path: .octopus-base-helper
          sparse-checkout: .github/scripts

      # Both registration paths can be wired at the same time — the release workflow's
      # immediate registration and the separate artifact-check workflow — and each
      # release-log entry is a commit that triggers downstream post-processing, so
      # registering twice runs that twice.
      #
      # This is an optimisation, NOT a guarantee: registration is an asynchronous
      # dispatch, so two callers can both read the log before either dispatch lands.
      # Removing duplicates for good has to happen where the log is written; see #174.
      #
      # Deliberately fail-open: if the log cannot be read, register anyway, because a
      # missing entry stalls the release pipeline while a duplicate one only repeats
      # bookkeeping.
      #
      # The lookup itself lives in a script so it can be tested — see
      # .github/workflows/test-release-log-has-version.yml. It prints "true" only when the
      # version is positively present in the log, and "false" for every unreadable or absent
      # case, which is what keeps this guard fail-open.
      - name: Skip if already registered
        id: already-registered
        env:
          GH_TOKEN: ${{ secrets.OCTOPUS_GITHUB_TOKEN }}
          RELEASE_LOG_REPOSITORY: ${{ inputs.release-log-repository }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          set -euo pipefail
          registered="$(bash .octopus-base-helper/.github/scripts/release-log-has-version.sh \
            "${RELEASE_LOG_REPOSITORY}" "${OCTOPUS_MODULE_NAME}" "${RELEASE_VERSION}")"
          echo "registered=${registered}" >> "$GITHUB_OUTPUT"

      - name: Launch action using REST
        # success() is explicit because a custom condition replaces the implicit
        # success gate rather than being added to it.
        if: ${{ success() && steps.already-registered.outputs.registered != 'true' }}
        env:
          OCTOPUS_GITHUB_TOKEN: ${{ secrets.OCTOPUS_GITHUB_TOKEN }}
          RELEASE_LOG_REPOSITORY: ${{ inputs.release-log-repository }}
          GITHUB_API_VERSION: ${{ inputs.github-api-version }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          set -euo pipefail
          # Build the JSON payload via jq so neither the module name nor the version can
          # break out of the JSON quoting, regardless of what characters they contain.
          payload="$(jq -n \
            --arg name "$OCTOPUS_MODULE_NAME" \
            --arg version "$RELEASE_VERSION" \
            '{event_type: "register-release", client_payload: {"octopus-module-name": $name, "release-version": $version}}')"

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${OCTOPUS_GITHUB_TOKEN}" \
            -H "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" \
            "https://api.github.com/repos/${RELEASE_LOG_REPOSITORY}/dispatches" \
            -d "$payload" \
            --fail

# This is a basic release workflow for Octopus gradle Java modules with publishing to Sonatype Nexus and/or image registry
name: Gradle Release

on:
  workflow_call:
    inputs:
      flow-type:
        required: true
        type: string # one of { public, hybrid }
      java-version:
        required: true
        type: string
      docker-image:
        description: 'Docker image name'
        required: false
        type: string
        default: ''
      increment-version-level:
        description: 'One of: {major, premajor, minor, preminor, patch, prepatch, prerelease}'
        required: false
        type: string
        default: patch
      commit-hash:
        description: 'Hash of the commit to checkout (for hybrid flow)'
        required: false
        type: string
        default: ''
      build-version:
        description: 'Version number to release (for hybrid flow)'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Run release flow without external side effects such as publishing or release creation'
        required: false
        type: boolean
        default: false
      register-release-immediately:
        description: 'Register release in octopus-release-log immediately (true) or wait for artifact check (false)'
        required: false
        type: boolean
        default: false
      skip-extra-tasks:
        description: 'Comma-separated Gradle task names to exclude from build (for example: integrationTest,ft)'
        required: false
        type: string
        default: ''
      staging-profile-id:
        description: 'Sonatype staging profile id (Central Portal namespace, e.g. org.octopusden). Bound to the gradle-nexus sonatype repository automatically via an injected init script — consumers need NO build-script change. Bypasses the flaky OSSRH-compat staging-profile auto-lookup. Blank = keep auto-lookup.'
        required: false
        type: string
        default: 'org.octopusden'
      publish-to-nexus:
        description: 'Publish Maven artifacts to Sonatype Central. Set false for deployable-only repos (app/UI) that nobody consumes as a Maven dependency.'
        required: false
        type: boolean
        default: true
      fat-jar-publication-allowlist:
        description: 'Comma-separated artifactIds exempt from the Maven Central publication guard (fat jar or oversized artifact). Any other artifact that trips the guard fails the release before upload. Use only for artifacts a consumer genuinely resolves from a Maven repository — e.g. an automation module fetched by a TeamCity metarunner.'
        required: false
        type: string
        default: ''
      max-central-artifact-mb:
        description: 'Size above which a published artifact fails the Maven Central publication guard, in MB. Catches fat jars that carry no marker in their name — e.g. a shadow jar published with the classifier stripped.'
        required: false
        type: number
        default: 8
      resume-deployment-id:
        description: 'Emergency re-run knob: Portal deployment id printed as RELEASE_PUBLISH_RESUME_DEPLOYMENT_ID by a failed run OF THIS SAME REPOSITORY. When set, the Gradle upload is SKIPPED and that existing deployment is published instead — use it after a run died past the upload, so the version is not uploaded twice. Callers must expose it in their own workflow_dispatch inputs to use it.'
        required: false
        type: string
        default: ''
    secrets:
      OSSRH_USERNAME:
        required: false
      OSSRH_TOKEN:
        required: false
      GPG_PASSPHRASE:
        required: false
      GPG_PRIVATE_KEY:
        required: false

jobs:
  prepare-build-publish-release:
    runs-on: ubuntu-latest
    environment: Prod
    # Serialize REAL releases per repository: two overlapping ones would compute the
    # same next version and upload it twice. Dry runs must NOT share that group —
    # a repository can run several release variants at once (octopus-test's
    # release-smoke matrix), and since GitHub keeps only one pending member per
    # group, the extra variants would be cancelled. So dry runs get a key that is
    # unique per run and variant, real publishes get the shared per-repository one.
    concurrency:
      group: >-
        release-${{ github.repository }}-${{ inputs.dry-run
          && format('dry-{0}-{1}-{2}-{3}', github.run_id, github.run_attempt, inputs.flow-type, inputs.docker-image)
          || 'publish' }}
      cancel-in-progress: false
    # The version is an input only for the hybrid flow; the public flow computes it
    # here. Publishing it as an output is what lets registration receive the version
    # that was actually released instead of an empty string.
    outputs:
      build-version: ${{ inputs.build-version || steps.new-version.outputs.version }}
    env:
      SKIP_TESTS: ''
      BUILD_VERSION: ''

    steps:
      # check input parameters
      - name: Unknown flow
        if: inputs.flow-type != 'public' && inputs.flow-type != 'hybrid'
        env:
          FLOW_TYPE: ${{ inputs.flow-type }}
        run: |
          echo "Unknown flow specified, should be one of {public, hybrid}: $FLOW_TYPE"
          exit 1

      - name: Fail if commit-hash is not set for hybrid flow
        if: inputs.flow-type == 'hybrid' && !inputs.commit-hash
        run: |
          echo "commit-hash input parameter must be set for hybrid flow"
          exit 1

      - name: Fail if build-version is not set for hybrid flow
        if: inputs.flow-type == 'hybrid' && !inputs.build-version
        run: |
          echo "build-version input parameter must be set for hybrid flow"
          exit 1

      - name: Public flow
        if: inputs.flow-type == 'public'
        run: |
          echo "Public flow, run with tests"

      - name: Hybrid flow
        if: inputs.flow-type == 'hybrid'
        env:
          COMMIT_HASH: ${{ inputs.commit-hash }}
          INPUT_BUILD_VERSION: ${{ inputs.build-version }}
        run: |
          set -euo pipefail
          echo "Hybrid flow:"
          echo "- Skipping tests"
          echo "- Commit hash: $COMMIT_HASH"
          echo "- Version: $INPUT_BUILD_VERSION"
          # A version is a coordinate that ends up in shell commands and file paths, so reject
          # anything that is not a plain version string before it reaches either.
          if [[ ! "$INPUT_BUILD_VERSION" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "build-version contains unexpected characters: $INPUT_BUILD_VERSION" >&2
            exit 1
          fi
          # set hybrid flow variables
          echo "SKIP_TESTS=-x test" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$INPUT_BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Apply extra skipped tasks
        if: inputs.skip-extra-tasks != ''
        env:
          SKIP_EXTRA_TASKS: ${{ inputs.skip-extra-tasks }}
        run: |
          echo "Applying extra skipped tasks: $SKIP_EXTRA_TASKS"
          EXTRA_SKIP_TESTS=""
          IFS=',' read -r -a tasks <<< "$SKIP_EXTRA_TASKS"
          for raw_task in "${tasks[@]}"; do
            # Trim leading/trailing spaces around task names.
            task="${raw_task#"${raw_task%%[![:space:]]*}"}"
            task="${task%"${task##*[![:space:]]}"}"
            if [[ -z "$task" ]]; then
              continue
            fi
            if [[ ! "$task" =~ ^[A-Za-z0-9:_.-]+$ ]]; then
              echo "Invalid task name in skip-extra-tasks: '$task'" >&2
              exit 1
            fi
            EXTRA_SKIP_TESTS="${EXTRA_SKIP_TESTS} -x ${task}"
          done
          echo "SKIP_TESTS=${SKIP_TESTS}${EXTRA_SKIP_TESTS}" >> "$GITHUB_ENV"

      - name: Dry run mode
        if: inputs.dry-run
        run: |
          echo "Dry run mode enabled:"
          echo "- External publishing steps will be skipped"
          echo "- Docker push will be skipped"
          echo "- GitHub release creation will be skipped"
          echo "- Release log registration will be skipped"

      - name: Fail if release secrets are not set for non-dry-run
        if: ${{ !inputs.dry-run && inputs.publish-to-nexus }}
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          missing=()
          for secret_name in OSSRH_USERNAME OSSRH_TOKEN GPG_PASSPHRASE GPG_PRIVATE_KEY; do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("${secret_name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required release secrets for non-dry-run: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      # checkout
      - name: Checkout latest
        if: inputs.flow-type == 'public'
        uses: actions/checkout@v3

      - name: Checkout from commit hash
        if: inputs.flow-type == 'hybrid' && inputs.commit-hash
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.commit-hash }}

      # A release must be able to tag the commit it builds — but for some commits
      # GITHUB_TOKEN cannot. GitHub refuses ANY ref update, via REST or git push, that
      # points a ref at a commit whose `.github/workflows/` files differ from the default
      # branch, unless the token is authorized to modify workflows — which the
      # GITHUB_TOKEN of Actions can never be. Verified empirically against a real
      # repository: the identical request succeeds at the default-branch head and is
      # refused for an older commit whose workflow files differ, and the REST refusal is
      # masked as HTTP 404 (`git push` says so plainly: "refusing to allow ... to create
      # or update workflow ... without `workflow` scope").
      #
      # This is checked here, before the build and the publish, because the tagging step
      # runs after artifacts are already on Maven Central. Failing there would leave a
      # version published, immutable, and untagged; failing here costs nothing.
      #
      # Deliberately skipped under dry-run, and NOT only to mirror the tagging step: the
      # octopus-test canary dispatches its smoke releases with `commit-hash: github.sha`
      # on a `verify/*` branch whose whole purpose is to repoint `uses:` at the octopus-base
      # commit under test, so its workflow files always differ from the default branch.
      # Running this check under dry-run would therefore fail every canary run, while
      # protecting nothing — a dry run creates no tag.
      - name: Fail early if the built commit cannot be tagged
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          built_sha="$(git rev-parse HEAD)"
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          default_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq '.sha')"

          if [ "$built_sha" = "$default_head" ]; then
            echo "Built commit is the ${default_branch} head: tagging is unrestricted."
            exit 0
          fi

          # Compare blob shas of the workflow directory rather than the commit diff: the
          # compare API caps `files` at 300 entries, which a wide backport could exceed,
          # hiding the very file that triggers the refusal. Only files present in the
          # BUILT tree matter — the refusal is about the tagged commit creating or
          # updating a workflow, so a workflow that exists only on the default branch is
          # not a problem. A missing directory (404) yields an empty list.
          list_workflows() {
            gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows?ref=$1" \
              --jq '[.[] | select(.type == "file") | .name + " " + .sha] | sort | .[]' 2>/dev/null || true
          }

          built_list="$(list_workflows "$built_sha")"
          default_list="$(list_workflows "$default_head")"

          blocking=""
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            if ! grep -qxF -- "$entry" <<<"$default_list"; then
              blocking="${blocking}${blocking:+, }${entry%% *}"
            fi
          done <<<"$built_list"

          if [ -n "$blocking" ]; then
            echo "::error title=Built commit cannot be tagged::This release builds ${built_sha}, whose workflow files differ from ${default_branch} (${blocking}). GitHub refuses to point a tag at such a commit with the Actions GITHUB_TOKEN, so the release could be published and never tagged. Release from a commit whose .github/workflows match ${default_branch}, or give the release a token authorized to modify workflows." >&2
            exit 1
          fi

          echo "Workflow files at ${built_sha} match ${default_branch}: the tag can be created."

      # determine release version (for public flow)
      - name: Get latest tag
        if: inputs.flow-type == 'public'
        id: tag_version
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ github.repository }}
          regex: '^v([0-9]+)\..*'

      - name: Prepare new tag version
        if: inputs.flow-type == 'public'
        uses: actions-ecosystem/action-bump-semver@v1
        id: new-tag-version
        with:
          current_version: ${{ steps.tag_version.outputs.tag }}
          level: ${{ inputs.increment-version-level }}

      - name: Parse new version
        if: inputs.flow-type == 'public'
        id: new-version
        env:
          TAG_VALUE: ${{ steps.new-tag-version.outputs.new_version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${TAG_VALUE}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "The version must match the format 'v<major>.<minor>.<patch>' but it has value ${TAG_VALUE}" >&2
            exit 1
          fi

          {
            echo "group1=${BASH_REMATCH[1]}"
            echo "group2=${BASH_REMATCH[2]}"
            echo "group3=${BASH_REMATCH[3]}"
            echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          } >> "$GITHUB_OUTPUT"

      - name: Save new version to env
        if: inputs.flow-type == 'public'
        env:
          NEW_VERSION: ${{ steps.new-version.outputs.version }}
        run: |
          echo "BUILD_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      # setup env
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      # gradle build
      - name: Gradle build
        if: inputs.docker-image == ''
        # shellcheck disable=SC2086 # SKIP_TESTS intentionally word-splits into `-x <task>` pairs
        run: ./gradlew build $SKIP_TESTS -PbuildVersion="$BUILD_VERSION" -Pversion="$BUILD_VERSION" --info -s

      - name: Gradle build docker image
        if: inputs.docker-image
        env:
          DOCKER_IMAGE: ${{ inputs.docker-image }}
        # shellcheck disable=SC2086 # SKIP_TESTS intentionally word-splits into `-x <task>` pairs
        run: ./gradlew build dockerBuildImage $SKIP_TESTS -Pdocker.image="$DOCKER_IMAGE" -Poctopus.github.docker.registry=ghcr.io -Pdocker.registry=docker.io -PbuildVersion="$BUILD_VERSION" -Pversion="$BUILD_VERSION" --info -s

      # push to docker
      - name: Log in to Docker Registry
        if: inputs.docker-image && !inputs.dry-run
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to docker registry
        if: inputs.docker-image && !inputs.dry-run
        env:
          DOCKER_IMAGE: ${{ inputs.docker-image }}
        run: docker push "ghcr.io/octopusden/$DOCKER_IMAGE:$BUILD_VERSION"

      # The publish helper lives in octopus-base, but this reusable workflow runs
      # against the CONSUMER's checkout — so fetch the script from the very commit
      # THIS workflow file comes from (`job.workflow_sha`), keeping script and
      # workflow versions in lockstep.
      #
      # Both steps deliberately run BEFORE the upload: once artifacts are staged a
      # failure here would leave an orphaned deployment that nothing can classify,
      # and the operator's natural plain re-run would upload the version twice.
      #
      # The guard requires a full commit SHA: an empty or non-SHA ref would make
      # actions/checkout silently resolve a branch/tag (its default branch), i.e. run
      # a different script than the pinned workflow — the very skew this prevents.
      - name: Resolve Portal publish helper ref
        id: helper-ref
        if: ${{ !inputs.dry-run && inputs.publish-to-nexus }}
        env:
          HELPER_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${HELPER_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Cannot pin the publish helper::job.workflow_sha resolved to '${HELPER_SHA}', which is not a full commit SHA, so the helper script cannot be pinned to this workflow version. Refusing to publish with an unpinned helper."
            exit 1
          fi
          echo "sha=${HELPER_SHA}" >> "$GITHUB_OUTPUT"
          echo "Publish helper pinned to octopus-base@${HELPER_SHA}"

      - name: Fetch Portal publish helper
        if: ${{ !inputs.dry-run && inputs.publish-to-nexus }}
        uses: actions/checkout@v4
        with:
          repository: octopusden/octopus-base
          ref: ${{ steps.helper-ref.outputs.sha }}
          path: .octopus-base-helper
          sparse-checkout: .github/scripts

      # Maven Central is for artifacts other projects consume as a DEPENDENCY. A Spring Boot
      # executable jar or a shadow/uber jar there is usually unintended — Gradle module metadata
      # can pull the shadow variant into `from(components.java)` without anyone asking — and a
      # single such artifact can exceed the org's entire monthly Central size quota.
      # Publish to a throwaway local repository first and inspect what would be uploaded, so an
      # oversized artifact fails the release BEFORE it reaches Central, where versions are
      # immutable. Runs in dry-run too: that is where the check is cheapest to act on.
      # Signing is force-disabled for this invocation — the guard must not need the GPG key, and
      # unsigned artifacts are enough to inspect names, sizes and archive contents.
      - name: Guard against publishing fat jars to Maven Central
        if: ${{ inputs.publish-to-nexus && inputs.resume-deployment-id == '' }}
        env:
          FAT_JAR_ALLOWLIST: ${{ inputs.fat-jar-publication-allowlist }}
          MAX_ARTIFACT_MB: ${{ inputs.max-central-artifact-mb }}
        run: |
          set -euo pipefail

          GUARD_REPO="$RUNNER_TEMP/m2-publication-guard"
          rm -rf "$GUARD_REPO"

          cat > "$RUNNER_TEMP/no-signing.init.gradle" <<'GRADLE'
          allprojects { proj ->
              proj.plugins.withId('signing') {
                  proj.extensions.getByName('signing').required = false
              }
          }
          GRADLE

          # -Pnexus=true must match the real upload below: some consumers shape their plugins
          # and publications on that property, so without it this dry publication could inspect
          # a different artifact set than the one publishToSonatype actually uploads.
          ./gradlew publishToMavenLocal \
            -Pnexus=true \
            -Dmaven.repo.local="$GUARD_REPO" \
            --init-script "$RUNNER_TEMP/no-signing.init.gradle" \
            -PbuildVersion="$BUILD_VERSION" -Pversion="$BUILD_VERSION" -s

          python3 - "$GUARD_REPO" <<'PY'
          import os, re, sys, zipfile
          from pathlib import Path

          repo = Path(sys.argv[1])
          allowed = {a.strip() for a in os.environ.get("FAT_JAR_ALLOWLIST", "").split(",") if a.strip()}
          max_mb = float(os.environ.get("MAX_ARTIFACT_MB") or 8)

          published, offenders = [], []
          # .zip is included because automation modules can publish shadow distributions and
          # TeamCity plugin bundles, which cost the same quota as a jar.
          for path in sorted(p for ext in ("*.jar", "*.zip", "*.tar", "*.tar.gz") for p in repo.rglob(ext)):
              # <group path>/<artifactId>/<version>/<file>
              artifact_id = path.parent.parent.name
              size_mb = path.stat().st_size / 1048576
              published.append((artifact_id, path.name, size_mb))
              reasons = []
              # Covers both the jar and the shadow distribution archive (-all.zip/-all.tar).
              if re.search(r"-all\.(jar|zip|tar(\.gz)?)$", path.name):
                  reasons.append("shadow/uber artifact (-all classifier)")
              else:
                  try:
                      with zipfile.ZipFile(path) as z:
                          if any(n.startswith("BOOT-INF/") for n in z.namelist()):
                              reasons.append("Spring Boot executable jar (BOOT-INF/)")
                  except zipfile.BadZipFile:
                      pass
              # Size is the signal that catches what the markers miss — e.g. a shadow jar
              # published with the classifier stripped, which is indistinguishable from a
              # library jar by name and has no BOOT-INF/ either.
              if size_mb > max_mb:
                  reasons.append(f"exceeds {max_mb:g} MB")
              if reasons and artifact_id not in allowed:
                  offenders.append((artifact_id, path.name, size_mb, "; ".join(reasons)))

          print(f"Inspected {len(published)} artifact(s) that would be published to Maven Central "
                f"(size limit {max_mb:g} MB):")
          for artifact_id, name, size_mb in published:
              print(f"  {artifact_id:<45} {name:<55} {size_mb:7.2f} MB")
          if allowed:
              print(f"Explicitly allowed: {', '.join(sorted(allowed))}")

          if offenders:
              print("\n::error::Artifact(s) unfit for Maven Central would be published", flush=True)
              for artifact_id, name, size_mb, reason in offenders:
                  print(f"  {artifact_id}: {name} ({size_mb:.2f} MB) — {reason}", file=sys.stderr)
              print(
                  "\nCentral is for artifacts consumed as a Maven dependency. Either stop publishing "
                  "this module (declare no MavenPublication for it, or set publish-to-nexus: false for "
                  "a repository nobody consumes), or — if a consumer really resolves this artifact from "
                  "a Maven repository, e.g. a TeamCity metarunner — add its artifactId to the "
                  "fat-jar-publication-allowlist input with that justification. Raise "
                  "max-central-artifact-mb only if a genuinely consumed library is legitimately large.",
                  file=sys.stderr,
              )
              sys.exit(1)
          print("\nPublication set is fit for Maven Central.")
          PY

      # Bind -PstagingProfileId to the gradle-nexus publish-plugin extension for
      # every project that applies it, without requiring any consumer build-script
      # change. Bypasses the flaky OSSRH-compat staging-profile auto-lookup. No-op
      # when staging-profile-id is blank (falls back to auto-lookup).
      - name: Prepare staging-profile init script
        if: ${{ !inputs.dry-run && inputs.publish-to-nexus && inputs.resume-deployment-id == '' }}
        run: |
          cat > "$RUNNER_TEMP/staging-profile.init.gradle" <<'GRADLE'
          allprojects { proj ->
              proj.plugins.withId('io.github.gradle-nexus.publish-plugin') {
                  def spid = proj.findProperty('stagingProfileId')?.toString()?.trim()
                  if (spid) {
                      proj.extensions.getByName('nexusPublishing')
                          .repositories.all { repo -> if (repo.name == 'sonatype') repo.stagingProfileId.set(spid) }
                  }
              }
          }
          GRADLE
          echo "Wrote $RUNNER_TEMP/staging-profile.init.gradle"

      # Upload + close the staging repository. The Nexus2-compat `release`
      # transition is NOT used: it leaves the deployment `closed`, so nothing ever
      # reaches Maven Central. The publish is driven explicitly through the Central
      # Portal API in the next step. Skipped entirely when resuming an existing
      # deployment (the artifacts are already uploaded).
      - name: Publish to Sonatype Nexus
        id: publish-sonatype
        if: ${{ !inputs.dry-run && inputs.publish-to-nexus && inputs.resume-deployment-id == '' }}
        run: |
          set -o pipefail
          ./gradlew -Pnexus=true -PstagingProfileId="$STAGING_PROFILE_ID" --init-script "$RUNNER_TEMP/staging-profile.init.gradle" publishToSonatype closeSonatypeStagingRepository -PbuildVersion="$BUILD_VERSION" -Pversion="$BUILD_VERSION" --info -s 2>&1 | tee "$RUNNER_TEMP/publish.log"
        env:
          STAGING_PROFILE_ID: ${{ inputs.staging-profile-id }}
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}

      # Explicit Central Portal publish: map the closed staging repository to its
      # Portal deployment, wait for VALIDATED, verify it is really OUR version and
      # namespace, publish, wait for PUBLISHED, and confirm every artifact is
      # resolvable on Maven Central. Only then may the release/tag be created.
      - name: Publish deployment via Central Portal
        id: portal-publish
        if: ${{ !inputs.dry-run && inputs.publish-to-nexus }}
        run: bash .octopus-base-helper/.github/scripts/portal-publish.sh
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          STAGING_PROFILE_ID: ${{ inputs.staging-profile-id }}
          PUBLISH_LOG: ${{ runner.temp }}/publish.log
          RESUME_DEPLOYMENT_ID: ${{ inputs.resume-deployment-id }}

      # On a Sonatype publish failure, surface WHY (and whether a retry can help):
      #  (1) HTTP status + body of the account's staging profiles;
      #  (2) the deployment's validation errors via the SUPPORTED path
      #      (/manual/search/repositories -> portal_deployment_id -> Portal
      #      /api/v1/publisher/status .errors); the compat /activity endpoint is
      #      unsupported (HTTP 400) so it is not used;
      #  (3) an evidence-based classification emitted as log markers
      #      RELEASE_PUBLISH_CLASS / RELEASE_PUBLISH_RETRYABLE for the caller /
      #      TeamCity to scrape (reusable-workflow step outputs are unreliable on
      #      failed runs). retryable=true is asserted ONLY on unambiguous infra
      #      signals (5xx / timeout / reset); Portal validation errors are
      #      deterministic; everything else stays 'unknown'. Reads only the Gradle
      #      failure section to avoid false matches from --info chatter.
      - name: Diagnose & classify Sonatype publish failure
        if: ${{ failure() && (steps.publish-sonatype.outcome == 'failure' || steps.portal-publish.outcome == 'failure') && !inputs.dry-run }}
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          RESUME_ID: ${{ inputs.resume-deployment-id }}
        run: |
          set +e
          host="https://ossrh-staging-api.central.sonatype.com"
          compat="$host/service/local"
          portal="https://central.sonatype.com/api/v1/publisher"
          log="$RUNNER_TEMP/publish.log"
          net=(--connect-timeout 15 --max-time 60)
          auth=("${net[@]}" -u "${MAVEN_USERNAME}:${MAVEN_PASSWORD}" -H 'Accept: application/json')
          bearer="Authorization: Bearer $(printf '%s:%s' "${MAVEN_USERNAME}" "${MAVEN_PASSWORD}" | base64 | tr -d '\n')"

          # GET (basic auth) into a file, print HTTP status, jq; raw body on parse-fail.
          dump() { # label url jq-filter
            local f; f="$RUNNER_TEMP/diag-$(echo "$1" | tr -c 'a-zA-Z0-9' _).json"
            local code; code=$(curl -sS -o "$f" -w '%{http_code}' "${auth[@]}" "$2" 2>/dev/null)
            echo "GET $2 -> HTTP ${code:-?}"
            local out; out=$(jq -r "$3" "$f" 2>/dev/null)
            if [ -n "$out" ]; then echo "$out"; else echo "  (unparsed body):"; head -c 2000 "$f"; echo; fi
          }

          echo "::group::Staging profiles visible to this account"
          dump "profiles" "$compat/staging/profiles" '.data[]? | "  name=\(.name)  id=\(.id)"'
          echo "::endgroup::"

          # Validation reason: the compat /activity endpoint is unsupported (HTTP 400),
          # so map the staging repo -> Portal deployment and read its .errors.
          portal_errors=""
          repo=$(grep -oE "Created staging repository '[^']+'" "$log" 2>/dev/null | head -1 | sed -E "s/^.*'([^']+)'.*$/\1/")
          if [ -n "$repo" ]; then
            echo "::group::Deployment status & validation errors for $repo"
            sf="$RUNNER_TEMP/diag-search.json"
            scode=$(curl -sS -o "$sf" -w '%{http_code}' "${net[@]}" -H "$bearer" -H 'Accept: application/json' "$host/manual/search/repositories" 2>/dev/null)
            echo "GET /manual/search/repositories -> HTTP ${scode:-?}"
            # The search 'key' is prefixed (e.g. "<user>/any/org.octopusden--<uuid>"),
            # so match on the repo id as a suffix rather than exact equality.
            did=$(jq -r --arg k "$repo" '.repositories[]? | select(.key | endswith($k)) | .portal_deployment_id' "$sf" 2>/dev/null | head -1)
            if [ -n "$did" ] && [ "$did" != "null" ]; then
              stf="$RUNNER_TEMP/diag-status.json"
              # Poll while the deployment is still validating; .errors appear only once FAILED.
              for i in 1 2 3 4 5; do
                pcode=$(curl -sS -o "$stf" -w '%{http_code}' "${net[@]}" -X POST -H "$bearer" -H 'Accept: application/json' "$portal/status?id=$did" 2>/dev/null)
                dstate=$(jq -r '.deploymentState // "?"' "$stf" 2>/dev/null)
                echo "POST /api/v1/publisher/status?id=$did (try $i) -> HTTP ${pcode:-?}  deploymentState=${dstate}"
                case "$dstate" in PENDING|VALIDATING|PUBLISHING) sleep 5 ;; *) break ;; esac
              done
              errs=$(jq -r 'if (.errors|type)=="object" then (.errors|to_entries[]|"  - \(.key): \(.value|tostring)") elif (.errors|type)=="array" then (.errors[]|"  - \(.|tostring)") else empty end' "$stf" 2>/dev/null)
              if [ -n "$errs" ]; then
                echo "  errors:"; echo "$errs"; portal_errors="$errs"
              else
                echo "  (no errors parsed; raw status body):"; head -c 2000 "$stf"; echo
              fi
            else
              echo "  No Portal deployment mapped for $repo — the close/release step did not hand the repository off to the Portal (typical for compat close/release failures), so there are no Portal validation errors to inspect."
            fi
            echo "::endgroup::"
          else
            if [ -n "${RESUME_ID:-}" ]; then
              echo "Resume mode: no local publish log (the upload was skipped by design)."
            else
              echo "No staging repository was created (failure before repo creation)."
            fi
          fi

          # Classify. Deterministic = Portal reported validation errors, or an explicit
          # auth failure. Transient = ONLY unambiguous infra signals. Everything else is
          # unknown (do NOT assert a retry will help). Reads only the Gradle failure section.
          sec=$(awk '/FAILURE: Build failed/{f=1} f{print}' "$log" 2>/dev/null)
          [ -z "$sec" ] && sec=$(tail -n 400 "$log" 2>/dev/null)
          cls="unknown"; retryable="unknown"
          if [ -n "$portal_errors" ] || printf '%s' "$sec" | grep -qiE 'responded with status code 40[13]|401 Unauthorized|403 Forbidden'; then
            cls="deterministic"; retryable="false"
          elif [ -n "$repo" ]; then
            # Artifacts are already staged (and possibly handed off to the Portal):
            # a plain re-dispatch would upload this version a second time.
            cls="resumable"; retryable="false"
            echo "RELEASE_PUBLISH_COMPAT_KEY=$repo"
            [ -n "${did:-}" ] && [ "${did:-}" != "null" ] && echo "RELEASE_PUBLISH_RESUME_DEPLOYMENT_ID=$did"
          elif printf '%s' "$sec" | grep -qiE 'responded with status code 5[0-9][0-9]|status code 5[0-9][0-9]|timed out|Read timed out|Connection reset|Connection refused'; then
            cls="transient"; retryable="true"
          fi
          # The Portal publish helper classifies its own failures precisely (it knows
          # whether a deployment exists and is resumable). Only classify here when it
          # did not, i.e. the failure happened in the Gradle upload/close stage.
          if [ -f "$RUNNER_TEMP/publish-classified" ]; then
            echo "Classification already emitted by the Portal publish step (see above)."
          else
            echo "RELEASE_PUBLISH_CLASS=${cls}"
            echo "RELEASE_PUBLISH_RETRYABLE=${retryable}"
            case "$cls" in
              deterministic) echo "::error title=Deterministic publish failure::Validation / auth error (see deployment errors above) — retrying will NOT help. Fix the artifact/credentials; do not re-dispatch." ;;
              transient)     echo "::warning title=Transient publish failure::Infrastructure instability (5xx/timeout) before anything was staged — a re-dispatch may succeed." ;;
              resumable)     echo "::error title=Resumable publish failure::The version is already staged, so a plain re-dispatch would upload it twice. Finish it with resume-deployment-id (see the id/compat key above), or drop that staging repository first." ;;
              *)             echo "::warning title=Unclassified publish failure::Could not classify — inspect the deployment errors and log above; there is no evidence a retry will help." ;;
            esac
          fi

      # github release — create the tag ourselves, at the commit that was actually built.
      # marvinpinto/action-automatic-releases has no target-commit input: it tags
      # `context.sha`, which for the repository_dispatch runs every release uses is the
      # default-branch head at dispatch time, frozen for the run, regardless of what was
      # checked out. A hybrid release of anything other than the current tip therefore
      # tagged code that was never built. HEAD here is the build's own checkout, so the
      # tag is correct by construction and the release is created from that tag.
      - name: Create release
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ env.BUILD_VERSION }}
        run: |
          set -euo pipefail

          built_sha="$(git rev-parse HEAD)"

          # The TAG is the authority, not the release: `gh release create --target` is IGNORED
          # when the tag already exists (REST: target_commitish is "unused if the Git tag already
          # exists"). A tag that outlived its release — deleting a release leaves the tag behind
          # unless it is removed separately — would otherwise silently re-point a new release at
          # stale code, which is the very bug this step exists to prevent. Ask the API rather than
          # the local clone: checkout is shallow and never fetches other tags.
          #
          # Fail closed: only a confirmed 404 means the tag does not exist. gh exits non-zero
          # for auth failures, rate limits, 5xx and network errors alike, and treating any of
          # those as "no tag" would fall through to creation on unverified state.
          ref_lookup=0
          ref_out="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>&1)" || ref_lookup=$?

          if [ "$ref_lookup" -eq 0 ]; then
            # Resolve through /commits so an annotated tag yields its commit, not the tag object.
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')"
            if [[ "$tag_sha" != "$built_sha" ]]; then
              echo "::error title=Release tag conflict::Tag ${TAG} already exists at ${tag_sha}, but this run built ${built_sha}. Not moving it. Delete the tag and its release (release immutability may prevent this once published), or release a new version." >&2
              exit 1
            fi
            # Fail closed here too: gh exits non-zero for a missing release and for a
            # rate limit, auth error or 5xx alike, and reading the latter as "no release"
            # makes the next line fail with a misleading "release already exists".
            rel_lookup=0
            rel_out="$(gh release view "$TAG" 2>&1)" || rel_lookup=$?
            if [ "$rel_lookup" -eq 0 ]; then
              echo "Release $TAG already exists at $built_sha — nothing to do."
              exit 0
            fi
            if ! grep -qE 'release not found|HTTP 404|"status": ?"404"' <<<"$rel_out"; then
              echo "$rel_out" >&2
              echo "::error title=Release lookup failed::Could not determine whether release ${TAG} exists. Refusing to act on unverified state; re-run when the API is reachable." >&2
              exit 1
            fi
            # Tag is correct but has no release: adopt it instead of creating a second one.
            gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
            echo "Created release $TAG on the existing, correct tag $built_sha"
            exit 0
          fi

          if ! grep -qE 'HTTP 404|"status": ?"404"' <<<"$ref_out"; then
            echo "$ref_out" >&2
            echo "::error title=Tag lookup failed::Could not determine whether ${TAG} exists (the lookup failed with something other than 404). Refusing to create a release on unverified state; re-run when the API is reachable." >&2
            exit 1
          fi

          # The tag is ours to create. Create the ref directly at the built commit instead of
          # `release create --target`: the Create Release endpoint rejects GITHUB_TOKEN when the
          # target commit differs from the default branch under .github/workflows — exactly the
          # backport case this fix exists for — and it would fail here, after the artifacts are
          # already published. Creating a plain ref to an existing commit has no such
          # restriction; --verify-tag then pins the release to that tag.
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${TAG}" -f sha="${built_sha}" --jq '.ref' >/dev/null
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          echo "Created tag and release $TAG at $built_sha"

      # Bind the release to the run that produced it. Registration happens afterwards
      # in a workflow_run context whose only trustworthy identity is this run's id and
      # attempt: a tag cannot say which release a run made when several releases share
      # a commit, and "the newest release" can move on while that job is queued. The
      # attempt is part of it because a rerun keeps the run id while the public flow
      # recomputes the version, so two releases would otherwise carry the same mark.
      # The marker is a delimited HTML comment: invisible in the rendered notes, and
      # not a prefix of another run's marker (555/1 vs 555/10).
      - name: Stamp the release with this run
        if: ${{ !inputs.dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ env.BUILD_VERSION }}
          MARKER: "<!-- octopus-release-run: ${{ github.run_id }}/${{ github.run_attempt }} -->"
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')"
          body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.body // ""')"
          printf '%s\n\n%s\n' "$body" "$MARKER" > "$RUNNER_TEMP/release-body.md"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F body=@"$RUNNER_TEMP/release-body.md" --jq '.tag_name' > /dev/null
          echo "Release ${TAG} stamped with '${MARKER}'"

  register-release-in-log:
      # register release in octopus-release-log
      if: inputs.register-release-immediately && !inputs.dry-run
      needs: prepare-build-publish-release
      uses: ./.github/workflows/common-register-release.yml
      name: Register release
      with:
        octopus-repository: ${{ github.repository }}
        release-version: ${{ needs.prepare-build-publish-release.outputs.build-version }}
      secrets: inherit

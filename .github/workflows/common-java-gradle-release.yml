# This is a basic release workflow for Octopus gradle Java modules with publishing to Sonatype Nexus and/or image registry
name: Gradle Release

on:
  workflow_call:
    inputs:
      flow-type:
        required: true
        type: string # one of { public, hybrid }
      java-version:
        required: true
        type: string
      docker-image:
        description: 'Docker image name'
        required: false
        type: string
        default: ''
      increment-version-level:
        description: 'One of: {major, premajor, minor, preminor, patch, prepatch, prerelease}'
        required: false
        type: string
        default: patch
      commit-hash:
        description: 'Hash of the commit to checkout (for hybrid flow)'
        required: false
        type: string
        default: ''
      build-version:
        description: 'Version number to release (for hybrid flow)'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Run release flow without external side effects such as publishing or release creation'
        required: false
        type: boolean
        default: false
      register-release-immediately:
        description: 'Register release in octopus-release-log immediately (true) or wait for artifact check (false)'
        required: false
        type: boolean
        default: false
      skip-extra-tasks:
        description: 'Comma-separated Gradle task names to exclude from build (for example: integrationTest,ft)'
        required: false
        type: string
        default: ''
      staging-profile-id:
        description: 'Sonatype staging profile id (Central Portal namespace, e.g. org.octopusden). Bound to the gradle-nexus sonatype repository automatically via an injected init script — consumers need NO build-script change. Bypasses the flaky OSSRH-compat staging-profile auto-lookup. Blank = keep auto-lookup.'
        required: false
        type: string
        default: 'org.octopusden'
    secrets:
      OSSRH_USERNAME:
        required: false
      OSSRH_TOKEN:
        required: false
      GPG_PASSPHRASE:
        required: false
      GPG_PRIVATE_KEY:
        required: false

jobs:
  prepare-build-publish-release:
    runs-on: ubuntu-latest
    environment: Prod
    env:
      SKIP_TESTS: ''
      BUILD_VERSION: ''

    steps:
      # check input parameters
      - name: Unknown flow
        if: inputs.flow-type != 'public' && inputs.flow-type != 'hybrid'
        run: |
          echo "Unknown flow specified, should be one of {public, hybrid}: " ${{ inputs.flow-type }}
          exit 1

      - name: Fail if commit-hash is not set for hybrid flow
        if: inputs.flow-type == 'hybrid' && !inputs.commit-hash
        run: |
          echo "commit-hash input parameter must be set for hybrid flow"
          exit 1

      - name: Fail if build-version is not set for hybrid flow
        if: inputs.flow-type == 'hybrid' && !inputs.build-version
        run: |
          echo "build-version input parameter must be set for hybrid flow"
          exit 1

      - name: Public flow
        if: inputs.flow-type == 'public'
        run: |
          echo "Public flow, run with tests"

      - name: Hybrid flow
        if: inputs.flow-type == 'hybrid'
        run: |
          echo "Hybrid flow:"
          echo "- Skipping tests"
          echo "- Commit hash: ${{ inputs.commit-hash }}"
          echo "- Version: ${{ inputs.build-version }}"
          # set hybrid flow variables
          echo "SKIP_TESTS=-x test" >> $GITHUB_ENV
          echo "BUILD_VERSION=${{ inputs.build-version }}" >> $GITHUB_ENV

      - name: Apply extra skipped tasks
        if: inputs.skip-extra-tasks != ''
        env:
          SKIP_EXTRA_TASKS: ${{ inputs.skip-extra-tasks }}
        run: |
          echo "Applying extra skipped tasks: $SKIP_EXTRA_TASKS"
          EXTRA_SKIP_TESTS=""
          IFS=',' read -r -a tasks <<< "$SKIP_EXTRA_TASKS"
          for raw_task in "${tasks[@]}"; do
            # Trim leading/trailing spaces around task names.
            task="${raw_task#"${raw_task%%[![:space:]]*}"}"
            task="${task%"${task##*[![:space:]]}"}"
            if [[ -z "$task" ]]; then
              continue
            fi
            if [[ ! "$task" =~ ^[A-Za-z0-9:_.-]+$ ]]; then
              echo "Invalid task name in skip-extra-tasks: '$task'" >&2
              exit 1
            fi
            EXTRA_SKIP_TESTS="${EXTRA_SKIP_TESTS} -x ${task}"
          done
          echo "SKIP_TESTS=${SKIP_TESTS}${EXTRA_SKIP_TESTS}" >> "$GITHUB_ENV"

      - name: Dry run mode
        if: inputs.dry-run
        run: |
          echo "Dry run mode enabled:"
          echo "- External publishing steps will be skipped"
          echo "- Docker push will be skipped"
          echo "- GitHub release creation will be skipped"
          echo "- Release log registration will be skipped"

      - name: Fail if release secrets are not set for non-dry-run
        if: ${{ !inputs.dry-run }}
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          missing=()
          for secret_name in OSSRH_USERNAME OSSRH_TOKEN GPG_PASSPHRASE GPG_PRIVATE_KEY; do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("${secret_name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required release secrets for non-dry-run: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      # checkout
      - name: Checkout latest
        if: inputs.flow-type == 'public'
        uses: actions/checkout@v3

      - name: Checkout from commit hash
        if: inputs.flow-type == 'hybrid' && inputs.commit-hash
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.commit-hash }}

      # determine release version (for public flow)
      - name: Get latest tag
        if: inputs.flow-type == 'public'
        id: tag_version
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ github.repository }}
          regex: '^v([0-9]+)\..*'

      - name: Prepare new tag version
        if: inputs.flow-type == 'public'
        uses: actions-ecosystem/action-bump-semver@v1
        id: new-tag-version
        with:
          current_version: ${{ steps.tag_version.outputs.tag }}
          level: ${{ inputs.increment-version-level }}

      - name: Parse new version
        if: inputs.flow-type == 'public'
        id: new-version
        env:
          TAG_VALUE: ${{ steps.new-tag-version.outputs.new_version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${TAG_VALUE}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "The version must match the format 'v<major>.<minor>.<patch>' but it has value ${TAG_VALUE}" >&2
            exit 1
          fi

          {
            echo "group1=${BASH_REMATCH[1]}"
            echo "group2=${BASH_REMATCH[2]}"
            echo "group3=${BASH_REMATCH[3]}"
            echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          } >> "$GITHUB_OUTPUT"

      - name: Save new version to env
        if: inputs.flow-type == 'public'
        run: |
          echo "BUILD_VERSION=${{ steps.new-version.outputs.version }}" >> $GITHUB_ENV

      # setup env
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      # gradle build
      - name: Gradle build
        if: inputs.docker-image == ''
        run: ./gradlew build ${{ env.SKIP_TESTS }} -PbuildVersion=${{ env.BUILD_VERSION }} -Pversion=${{ env.BUILD_VERSION }} --info -s

      - name: Gradle build docker image
        if: inputs.docker-image
        run: ./gradlew build dockerBuildImage ${{ env.SKIP_TESTS }} -Pdocker.image=${{ inputs.docker-image }} -Poctopus.github.docker.registry=ghcr.io -Pdocker.registry=docker.io -PbuildVersion=${{ env.BUILD_VERSION }} -Pversion=${{ env.BUILD_VERSION }} --info -s

      # push to docker
      - name: Log in to Docker Registry
        if: inputs.docker-image && !inputs.dry-run
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to docker registry
        if: inputs.docker-image && !inputs.dry-run
        run: docker push ghcr.io/octopusden/${{ inputs.docker-image }}:${{ env.BUILD_VERSION }}

      # Bind -PstagingProfileId to the gradle-nexus publish-plugin extension for
      # every project that applies it, without requiring any consumer build-script
      # change. Bypasses the flaky OSSRH-compat staging-profile auto-lookup. No-op
      # when staging-profile-id is blank (falls back to auto-lookup).
      - name: Prepare staging-profile init script
        if: ${{ !inputs.dry-run }}
        run: |
          cat > "$RUNNER_TEMP/staging-profile.init.gradle" <<'GRADLE'
          allprojects { proj ->
              proj.plugins.withId('io.github.gradle-nexus.publish-plugin') {
                  def spid = proj.findProperty('stagingProfileId')?.toString()?.trim()
                  if (spid) {
                      proj.extensions.getByName('nexusPublishing')
                          .repositories.all { repo -> if (repo.name == 'sonatype') repo.stagingProfileId.set(spid) }
                  }
              }
          }
          GRADLE
          echo "Wrote $RUNNER_TEMP/staging-profile.init.gradle"

      # publish to nexus
      - name: Publish to Sonatype Nexus
        id: publish-sonatype
        if: ${{ !inputs.dry-run }}
        run: |
          set -o pipefail
          ./gradlew -Pnexus=true -PstagingProfileId="$STAGING_PROFILE_ID" --init-script "$RUNNER_TEMP/staging-profile.init.gradle" publishToSonatype closeAndReleaseSonatypeStagingRepository -PbuildVersion=${{ env.BUILD_VERSION }} -Pversion=${{ env.BUILD_VERSION }} --info -s 2>&1 | tee "$RUNNER_TEMP/publish.log"
        env:
          STAGING_PROFILE_ID: ${{ inputs.staging-profile-id }}
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}

      # On a Sonatype publish failure, surface WHY and whether a retry can help.
      # Dumps: (1) the staging profiles the account sees (profile-lookup issues),
      # (2) the created staging repo's state + activity events (close/release
      # validation-rule reasons), and classifies the failure as deterministic
      # (do not retry) vs transient (a re-dispatch may help). Emits a machine
      # marker (RELEASE_PUBLISH_RETRYABLE + step output) so the caller/TeamCity
      # can stop re-dispatching on deterministic failures.
      - name: Diagnose & classify Sonatype publish failure
        id: diagnose-sonatype
        if: ${{ failure() && steps.publish-sonatype.outcome == 'failure' && !inputs.dry-run }}
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        run: |
          set +e
          base="https://ossrh-staging-api.central.sonatype.com/service/local"
          log="$RUNNER_TEMP/publish.log"
          auth=(-u "${MAVEN_USERNAME}:${MAVEN_PASSWORD}" -H 'Accept: application/json')

          echo "::group::Staging profiles visible to this account"
          curl -s "${auth[@]}" "$base/staging/profiles" \
            | (jq -r '.data[]? | "  name=\(.name)  id=\(.id)"' 2>/dev/null || cat)
          echo "::endgroup::"

          # If a staging repo was created, dump its state + activity — this is where
          # close/release validation-rule failures are reported.
          repo=$(grep -oE 'org\.octopusden--[0-9a-f-]+' "$log" 2>/dev/null | head -1)
          if [ -n "$repo" ]; then
            echo "::group::Staging repository $repo — state & activity"
            curl -s "${auth[@]}" "$base/staging/repository/$repo" \
              | (jq -r '"  type=\(.type)  transitioning=\(.transitioning)  notifications=\(.notifications // 0)"' 2>/dev/null || cat)
            curl -s "${auth[@]}" "$base/staging/repository/$repo/activity" \
              | (jq -r '.[]?.events[]? | select((.name // "")|test("fail|error|rule|broken";"i")) | "  event=\(.name) " + ([.properties[]? | "\(.name)=\(.value)"] | join(" "))' 2>/dev/null \
                 || echo "  (could not parse activity)")
            echo "::endgroup::"
          else
            echo "No staging repository id found in publish log (failure before repo creation)."
          fi

          # Classify the failure for retry decisions.
          retryable=true; reason="unknown"
          if grep -qiE 'Failed to find staging profile|status code 401|401 Unauthorized|Content validation failed|Invalid POM|missing .*signature|No public key|Invalid signature' "$log" 2>/dev/null; then
            retryable=false; reason="deterministic (profile / auth / artifact validation)"
          elif grep -qiE 'No objects found|status code 5[0-9][0-9]|timed out|Connection reset|Read timed out|not in desired state' "$log" 2>/dev/null; then
            retryable=true; reason="transient (OSSRH-compat instability)"
          fi
          echo "RELEASE_PUBLISH_FAILURE_CLASS=${reason}"
          echo "RELEASE_PUBLISH_RETRYABLE=${retryable}"
          echo "retryable=${retryable}" >> "$GITHUB_OUTPUT"
          if [ "$retryable" = "false" ]; then
            echo "::error title=Deterministic publish failure::${reason} — retrying will NOT help. Fix config/credentials/artifact; do not re-dispatch."
          else
            echo "::warning title=Transient publish failure::${reason} — a re-dispatch may succeed."
          fi

      # github release
      - name: Create release
        if: ${{ !inputs.dry-run }}
        uses: marvinpinto/action-automatic-releases@v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          automatic_release_tag: v${{ env.BUILD_VERSION }}

  register-release-in-log:
      # register release in octopus-release-log
      if: inputs.register-release-immediately && !inputs.dry-run
      needs: prepare-build-publish-release
      uses: ./.github/workflows/common-register-release.yml
      name: Register release
      with:
        octopus-repository: ${{ github.repository }}
        release-version:  ${{ inputs.build-version }}
      secrets: inherit

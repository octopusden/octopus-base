# This is a basic release workflow for Octopus gradle Java modules with publishing to Sonatype Nexus and/or image registry
name: Gradle Release

on:
  workflow_call:
    inputs:
      flow-type:
        required: true
        type: string # one of { public, hybrid }
      java-version:
        required: true
        type: string
      docker-image:
        description: 'Docker image name'
        required: false
        type: string
        default: ''
      increment-version-level:
        description: 'One of: {major, premajor, minor, preminor, patch, prepatch, prerelease}'
        required: false
        type: string
        default: patch
      commit-hash:
        description: 'Hash of the commit to checkout (for hybrid flow)'
        required: false
        type: string
        default: ''
      build-version:
        description: 'Version number to release (for hybrid flow)'
        required: false
        type: string
        default: ''
      dry-run:
        description: 'Run release flow without external side effects such as publishing or release creation'
        required: false
        type: boolean
        default: false
      register-release-immediately:
        description: 'Register release in octopus-release-log immediately (true) or wait for artifact check (false)'
        required: false
        type: boolean
        default: false
      skip-extra-tasks:
        description: 'Comma-separated Gradle task names to exclude from build (for example: integrationTest,ft)'
        required: false
        type: string
        default: ''
      staging-profile-id:
        description: 'Sonatype staging profile id (Central Portal namespace, e.g. org.octopusden). Bound to the gradle-nexus sonatype repository automatically via an injected init script — consumers need NO build-script change. Bypasses the flaky OSSRH-compat staging-profile auto-lookup. Blank = keep auto-lookup.'
        required: false
        type: string
        default: 'org.octopusden'
      publish-to-nexus:
        description: 'Publish Maven artifacts to Sonatype Central. Set false for deployable-only repos (app/UI) that nobody consumes as a Maven dependency.'
        required: false
        type: boolean
        default: true
      fat-jar-publication-allowlist:
        description: 'Comma-separated artifactIds exempt from the Maven Central publication guard (fat jar or oversized artifact). Any other artifact that trips the guard fails the release before upload. Use only for artifacts a consumer genuinely resolves from a Maven repository — e.g. an automation module fetched by a TeamCity metarunner.'
        required: false
        type: string
        default: ''
      max-central-artifact-mb:
        description: 'Size above which a published artifact fails the Maven Central publication guard, in MB. Catches fat jars that carry no marker in their name — e.g. a shadow jar published with the classifier stripped.'
        required: false
        type: number
        default: 8
      resume-deployment-id:
        description: 'Emergency re-run knob: Portal deployment id printed as RELEASE_PUBLISH_RESUME_DEPLOYMENT_ID by a failed run OF THIS SAME REPOSITORY. When set, the Gradle upload is SKIPPED and that existing deployment is published instead — use it after a run died past the upload, so the version is not uploaded twice. Callers must expose it in their own workflow_dispatch inputs to use it.'
        required: false
        type: string
        default: ''
    secrets:
      OSSRH_USERNAME:
        required: false
      OSSRH_TOKEN:
        required: false
      GPG_PASSPHRASE:
        required: false
      GPG_PRIVATE_KEY:
        required: false

# Serialize REAL releases per repository: two overlapping ones would compute the same next
# version and upload it twice. This sits at WORKFLOW level, not on the publish job, so the
# lease spans publish -> tag/release -> registration. On the job it ended when publishing
# ended, which left a window in which the next public-flow release could read
# `find-latest-tag` before the previous run's tag existed and compute a version that was
# already released. Workflow level is also the only placement that works for a reusable
# workflow: a group set by the caller on the job that calls it does not gate the called
# workflow's own jobs.
#
# Dry runs must NOT share the group. A repository can run several release variants at once
# (octopus-test's release-smoke matrix), and GitHub keeps only one PENDING member per
# group, so a third variant sharing a key would be cancelled outright rather than queued.
# The key must therefore separate every variant the caller actually varies: two smoke
# variants differing only in publish-to-nexus were colliding and serializing needlessly,
# one more such variant away from cancelling each other. Add any new distinguishing input
# here as well. Real publishes get the shared per-repository key.
concurrency:
  group: >-
    release-${{ github.repository }}-${{ inputs.dry-run
      && format('dry-{0}-{1}-{2}-{3}-{4}', github.run_id, github.run_attempt, inputs.flow-type, inputs.docker-image, inputs.publish-to-nexus)
      || 'publish' }}
  cancel-in-progress: false

jobs:
  prepare-build-publish-release:
    runs-on: ubuntu-latest
    environment: Prod
    # The version is an input only for the hybrid flow; the public flow computes it
    # here. Publishing it as an output is what lets registration receive the version
    # that was actually released instead of an empty string.
    outputs:
      build-version: ${{ inputs.build-version || steps.new-version.outputs.version }}
      # The commit this job actually built. Published so the tagging job tags exactly
      # that, instead of re-resolving a ref that may have moved in the meantime.
      built-sha: ${{ steps.built-commit.outputs.sha }}
    env:
      SKIP_TESTS: ''
      BUILD_VERSION: ''

    steps:
      # check input parameters
      - name: Unknown flow
        if: inputs.flow-type != 'public' && inputs.flow-type != 'hybrid'
        env:
          FLOW_TYPE: ${{ inputs.flow-type }}
        run: |
          echo "Unknown flow specified, should be one of {public, hybrid}: $FLOW_TYPE"
          exit 1

      - name: Fail if commit-hash is not set for hybrid flow
        if: inputs.flow-type == 'hybrid' && !inputs.commit-hash
        run: |
          echo "commit-hash input parameter must be set for hybrid flow"
          exit 1

      - name: Fail if build-version is not set for hybrid flow
        if: inputs.flow-type == 'hybrid' && !inputs.build-version
        run: |
          echo "build-version input parameter must be set for hybrid flow"
          exit 1

      - name: Public flow
        if: inputs.flow-type == 'public'
        run: |
          echo "Public flow, run with tests"

      - name: Hybrid flow
        if: inputs.flow-type == 'hybrid'
        env:
          COMMIT_HASH: ${{ inputs.commit-hash }}
          INPUT_BUILD_VERSION: ${{ inputs.build-version }}
        run: |
          set -euo pipefail
          echo "Hybrid flow:"
          echo "- Skipping tests"
          echo "- Commit hash: $COMMIT_HASH"
          echo "- Version: $INPUT_BUILD_VERSION"
          # A version is a coordinate that ends up in shell commands and file paths, so reject
          # anything that is not a plain version string before it reaches either.
          if [[ ! "$INPUT_BUILD_VERSION" =~ ^[A-Za-z0-9._+-]+$ ]]; then
            echo "build-version contains unexpected characters: $INPUT_BUILD_VERSION" >&2
            exit 1
          fi
          # set hybrid flow variables
          echo "SKIP_TESTS=-x test" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$INPUT_BUILD_VERSION" >> "$GITHUB_ENV"

      - name: Apply extra skipped tasks
        if: inputs.skip-extra-tasks != ''
        env:
          SKIP_EXTRA_TASKS: ${{ inputs.skip-extra-tasks }}
        run: |
          echo "Applying extra skipped tasks: $SKIP_EXTRA_TASKS"
          EXTRA_SKIP_TESTS=""
          IFS=',' read -r -a tasks <<< "$SKIP_EXTRA_TASKS"
          for raw_task in "${tasks[@]}"; do
            # Trim leading/trailing spaces around task names.
            task="${raw_task#"${raw_task%%[![:space:]]*}"}"
            task="${task%"${task##*[![:space:]]}"}"
            if [[ -z "$task" ]]; then
              continue
            fi
            if [[ ! "$task" =~ ^[A-Za-z0-9:_.-]+$ ]]; then
              echo "Invalid task name in skip-extra-tasks: '$task'" >&2
              exit 1
            fi
            EXTRA_SKIP_TESTS="${EXTRA_SKIP_TESTS} -x ${task}"
          done
          echo "SKIP_TESTS=${SKIP_TESTS}${EXTRA_SKIP_TESTS}" >> "$GITHUB_ENV"

      - name: Dry run mode
        if: inputs.dry-run
        run: |
          echo "Dry run mode enabled:"
          echo "- External publishing steps will be skipped"
          echo "- Docker push will be skipped"
          echo "- GitHub release creation will be skipped"
          echo "- Release log registration will be skipped"

      - name: Fail if release secrets are not set for non-dry-run
        if: ${{ !inputs.dry-run && inputs.publish-to-nexus }}
        env:
          OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          OSSRH_TOKEN: ${{ secrets.OSSRH_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          missing=()
          for secret_name in OSSRH_USERNAME OSSRH_TOKEN GPG_PASSPHRASE GPG_PRIVATE_KEY; do
            if [[ -z "${!secret_name}" ]]; then
              missing+=("${secret_name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required release secrets for non-dry-run: %s\n' "${missing[*]}" >&2
            exit 1
          fi

      # checkout
      - name: Checkout latest
        if: inputs.flow-type == 'public'
        uses: actions/checkout@v3

      - name: Checkout from commit hash
        if: inputs.flow-type == 'hybrid' && inputs.commit-hash
        uses: actions/checkout@v3
        with:
          ref: ${{ inputs.commit-hash }}

      - name: Record the built commit
        id: built-commit
        env:
          RESUME_DEPLOYMENT_ID: ${{ inputs.resume-deployment-id }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          # Assign first: `echo "sha=$(git rev-parse HEAD)"` succeeds even when rev-parse
          # fails, writing an empty sha that is only caught after the publish.
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          # A workflow command ends at a newline and delimits on `::`, so an id carrying either
          # would truncate or split the annotation. The id is a Portal UUID in practice; this
          # keeps a hand-typed one from rewriting the message around it.
          resume_id_safe="$(printf '%s' "${RESUME_DEPLOYMENT_ID}" | tr -cd 'A-Za-z0-9._:-' | cut -c1-64)"
          # Leave the commit where a failed run's reader will find it: as an annotation on the
          # run page and in the step summary, not only in a job output that a failed job does
          # not expose. A run that dies after Central accepted the upload is recovered by
          # tagging THIS commit (octopus-base#189), and the head of the branch is usually not it.
          if [ "${DRY_RUN}" = "true" ]; then
            # A dry run publishes nothing, so this commit is not evidence of anything. Said rather
            # than suppressed: the value is still what a reader of this run wants, and the
            # reconciler asks Central regardless of what any annotation claims.
            echo "::notice title=Built commit (dry run — nothing published)::${sha}"
            { echo "### Built commit (dry run)"; echo ""; echo "\`${sha}\` — nothing was published by this run."; } >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${RESUME_DEPLOYMENT_ID}" ]; then
            # On a resume the artifacts were built by an EARLIER run, so this HEAD is not the
            # commit that was published. Say so where the wrong value would otherwise be read.
            echo "::notice title=Built commit belongs to an earlier run::This run resumed Portal deployment ${resume_id_safe}, built by an earlier run. Its HEAD (${sha}) is NOT the published commit. Use the earlier run's Built commit entry, or its checkout sha, and attest that."
            { echo "### Built commit"; echo ""; echo "Not this run's HEAD: resumed deployment \`${resume_id_safe}\` from an earlier run. Take the commit from that run."; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=Built commit::${sha}"
            { echo "### Built commit"; echo ""; echo "\`${sha}\`"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # A release must be able to tag the commit it builds — and for some commits the
      # Actions GITHUB_TOKEN cannot. GitHub refuses any ref update, REST or git push,
      # that points a ref at a commit carrying a workflow file that exists on no branch
      # head, unless the token is authorized to modify workflows, which GITHUB_TOKEN can
      # never be. Measured against a real repository with a token lacking `workflow`
      # scope, which is the same authorization GITHUB_TOKEN lacks:
      #
      #   default-branch head                                          -> allowed
      #   head of another branch, workflows differing from the default  -> allowed
      #   non-head commit whose workflows equal another branch head's   -> allowed
      #   commit merely missing a workflow file a branch head has       -> allowed
      #   non-head commit whose workflows match no branch head          -> REFUSED
      #
      # So the operative rule is "every workflow file this commit carries exists
      # byte-identical on some branch head"; deleting one does not count as modifying it.
      # Comparing against the default branch alone would be wrong — it would refuse the
      # ordinary release of a maintenance-branch tip, which GitHub allows. REST disguises
      # the refusal as HTTP 404; git push states it outright ("refusing to allow ... to
      # create or update workflow ... without `workflow` scope").
      #
      # Checked before the build and the publish, because the tagging step runs after the
      # artifacts are on Maven Central: failing there leaves a version published,
      # immutable and untagged, while failing here costs nothing. It runs under dry-run
      # too — it is read-only, and dry runs skip the tagging step itself, so this is the
      # only coverage the logic gets.
      - name: Fail early if the built commit cannot be tagged
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          built_sha="$(git rev-parse HEAD)"
          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch')"
          default_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${default_branch}" --jq '.sha')"

          if [ "$built_sha" = "$default_head" ]; then
            echo "Built commit is the ${default_branch} head: the tag can be created."
            exit 0
          fi

          # One "name blob-sha" line per workflow file. Fail closed: only a confirmed 404
          # (no such directory at that ref) may be read as "no workflow files". Treating a
          # rate limit, 5xx or auth error as an empty list would wave through exactly the
          # release this step exists to stop. The directory listing is used rather than a
          # commit diff because the compare API caps `files` at 300 entries, which a wide
          # backport can exceed, hiding the one file that triggers the refusal.
          list_workflows() {
            local out rc=0
            out="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows?ref=$1" \
              --jq '[.[] | select(.type == "file") | .name + " " + .sha] | sort | .[]' 2>&1)" || rc=$?
            if [ "$rc" -eq 0 ]; then
              printf '%s\n' "$out"
              return 0
            fi
            if grep -qE 'HTTP 404|"status": ?"404"' <<<"$out"; then
              return 0
            fi
            printf '%s\n' "$out" >&2
            echo "::error title=Workflow listing failed::Could not list .github/workflows at $1, so whether ${built_sha} can be tagged is unknown. Refusing to start a release on unverified state; re-run when the API is reachable." >&2
            return 1
          }

          # Names of workflow files the built commit carries that the candidate does not
          # carry identically. Empty means the candidate covers the built commit.
          missing_against() {
            local candidate_list="$1" missing="" entry
            while IFS= read -r entry; do
              [ -n "$entry" ] || continue
              grep -qxF -- "$entry" <<<"$candidate_list" || missing="${missing}${missing:+, }${entry%% *}"
            done <<<"$built_list"
            printf '%s' "$missing"
          }

          # Assign every lookup to a variable: a command substitution that fails inside an
          # argument list would not trip `set -e`, quietly restoring the fail-open bug.
          built_list="$(list_workflows "$built_sha")"
          default_list="$(list_workflows "$default_head")"
          blocking="$(missing_against "$default_list")"

          if [ -z "$blocking" ]; then
            echo "Workflow files at ${built_sha} are present unchanged on ${default_branch}: the tag can be created."
            exit 0
          fi

          # Any branch head will do. Fetch them once, failing closed: an unreadable branch
          # list must stop the release, not read as "no branch covers this commit".
          branch_lookup=0
          branch_heads_raw="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/branches" --jq '.[].commit.sha' 2>&1)" || branch_lookup=$?
          if [ "$branch_lookup" -ne 0 ]; then
            printf '%s\n' "$branch_heads_raw" >&2
            echo "::error title=Branch lookup failed::Could not list branches, so whether ${built_sha} can be tagged is unknown. Refusing to start a release on unverified state; re-run when the API is reachable." >&2
            exit 1
          fi
          branch_heads="$(sort -u <<<"$branch_heads_raw")"

          # A commit that IS a branch head has workflow files trivially identical to that
          # head's, so it is taggable. Checked before the scan below because it costs no
          # further API calls and is the ordinary maintenance-branch-tip release.
          if grep -qxF -- "$built_sha" <<<"$branch_heads"; then
            echo "Built commit is a branch head: the tag can be created."
            exit 0
          fi

          # The remaining question — does some OTHER branch head carry these same workflow
          # files — costs one call per branch, and only a real release needs the answer: a
          # dry run neither publishes nor tags, so it stops here rather than scanning. This
          # matters because the dry-run canary builds a pull-request merge commit, which
          # heads no branch, and would otherwise scan every branch on every run.
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::warning title=Built commit may not be taggable::${built_sha} carries workflow files (${blocking}) that are not on ${default_branch}, and it heads no branch. A REAL release would now scan the other branch heads for a match and refuse the release if none covered it. Skipped here because this is a dry run."
            exit 0
          fi

          while IFS= read -r branch_head; do
            [ -n "$branch_head" ] || continue
            [ "$branch_head" = "$default_head" ] && continue
            candidate_list="$(list_workflows "$branch_head")"
            if [ -z "$(missing_against "$candidate_list")" ]; then
              echo "Workflow files at ${built_sha} are present unchanged on branch head ${branch_head}: the tag can be created."
              exit 0
            fi
          done <<<"$branch_heads"

          echo "::error title=Built commit cannot be tagged::This release builds ${built_sha}, which carries workflow files (${blocking}) that exist on no branch head. GitHub refuses to point a tag at such a commit with the Actions GITHUB_TOKEN, so the release would publish and then fail untagged. Release a commit whose .github/workflows match a branch head, or give the release a token authorized to modify workflows." >&2
          exit 1

      # determine release version (for public flow)
      - name: Get latest tag
        if: inputs.flow-type == 'public'
        id: tag_version
        uses: oprypin/find-latest-tag@v1
        with:
          repository: ${{ github.repository }}
          regex: '^v([0-9]+)\..*'

      - name: Prepare new tag version
        if: inputs.flow-type == 'public'
        uses: actions-ecosystem/action-bump-semver@v1
        id: new-tag-version
        with:
          current_version: ${{ steps.tag_version.outputs.tag }}
          level: ${{ inputs.increment-version-level }}

      - name: Parse new version
        if: inputs.flow-type == 'public'
        id: new-version
        env:
          TAG_VALUE: ${{ steps.new-tag-version.outputs.new_version }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "${TAG_VALUE}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "The version must match the format 'v<major>.<minor>.<patch>' but it has value ${TAG_VALUE}" >&2
            exit 1
          fi

          {
            echo "group1=${BASH_REMATCH[1]}"
            echo "group2=${BASH_REMATCH[2]}"
            echo "group3=${BASH_REMATCH[3]}"
            echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          } >> "$GITHUB_OUTPUT"

      - name: Save new version to env
        if: inputs.flow-type == 'public'
        env:
          NEW_VERSION: ${{ steps.new-version.outputs.version }}
        run: |
          echo "BUILD_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      # setup env
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      # The release helpers live in octopus-base, but this reusable workflow runs
      # against the CONSUMER's checkout — so fetch them from the very commit THIS
      # workflow file comes from (`job.workflow_sha`), keeping script and workflow
      # versions in lockstep.
      #
      # Fetched here, before the build, because the Central preflight below is the
      # first helper user. Everything that follows — the fat-jar guard, the upload, the
      # Portal publish — therefore also runs with the helpers already on disk: a failure
      # in the fetch itself can no longer happen after artifacts are staged, where it
      # would leave an orphaned deployment that nothing can classify and invite a plain
      # re-run that uploads the version twice.
      #
      # It cannot move any earlier: the checkout of the consumer's own repository cleans
      # its target directory, so a helper fetched before it would be wiped.
      #
      # The guard requires a full commit SHA: an empty or non-SHA ref would make
      # actions/checkout silently resolve a branch/tag (its default branch), i.e. run
      # a different script than the pinned workflow — the very skew this prevents.
      - name: Resolve Portal publish helper ref
        id: helper-ref
        if: ${{ inputs.publish-to-nexus }}
        env:
          HELPER_SHA: ${{ job.workflow_sha }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          if [[ ! "${HELPER_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            # A real release must not proceed unpinned. A dry run reports no ref and the
            # fetch below is skipped for want of one — which is NOT the same as letting it
            # run with an empty ref: actions/checkout would then silently resolve its
            # default branch, i.e. run an unpinned helper, the very skew this guard exists
            # to prevent.
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::warning title=Publish helper not pinned::job.workflow_sha resolved to '${HELPER_SHA}', which is not a full commit SHA. Skipping the helper fetch; the Central preflight will report that it could not check. A real release would stop here."
              exit 0
            fi
            echo "::error title=Cannot pin the publish helper::job.workflow_sha resolved to '${HELPER_SHA}', which is not a full commit SHA, so the helper script cannot be pinned to this workflow version. Refusing to publish with an unpinned helper."
            exit 1
          fi
          echo "sha=${HELPER_SHA}" >> "$GITHUB_OUTPUT"
          echo "Publish helper pinned to octopus-base@${HELPER_SHA}"

      - name: Fetch Portal publish helper
        if: ${{ inputs.publish-to-nexus && steps.helper-ref.outputs.sha != '' }}
        # A real release cannot proceed without these helpers: the publish step is one of
        # them. A dry run can — nothing downstream of it uses them except the preflight,
        # which is fail-open by design. So a transient failure fetching octopus-base must
        # not fail a dry run that, before this step moved here, touched nothing outside the
        # consumer's own checkout at this point in the job.
        continue-on-error: ${{ inputs.dry-run }}
        uses: actions/checkout@v4
        with:
          repository: octopusden/octopus-base
          ref: ${{ steps.helper-ref.outputs.sha }}
          path: .octopus-base-helper
          sparse-checkout: .github/scripts

      # Maven Central versions are immutable, so a version that is already there can
      # never be published again — and until this step existed the release found that out
      # only at the very end, at `closeSonatypeStagingRepository`, after a full build,
      # sign, stage and upload, reported as "Deployment reached an unexpected status:
      # Failed" with `already exists` buried underneath (#195).
      #
      # Ask Maven Central up front instead. The coordinates come from Gradle's own
      # publication model, listed at CONFIGURATION time — no compilation, no signing, and one
      # HEAD per publication under a bounded overall budget — so this costs seconds against a
      # build of minutes, and stays cheap even when repo1 is having a bad day.
      # `-Pnexus=true` and the version properties are passed exactly as the real upload
      # passes them, because some consumers shape their publications on those: without
      # them this could inspect a different artifact set than the one that gets uploaded.
      #
      # Everything here is deliberately fail-open — see the helper's header. This step can
      # only save a build that was going to fail anyway, so an unlistable publication set
      # or an unreachable repo1 warns and continues rather than blocking a release that
      # would have succeeded. Skipped when resuming a deployment: there the version is
      # already staged on purpose.
      - name: Preflight — is this version already on Maven Central?
        if: ${{ inputs.publish-to-nexus && inputs.resume-deployment-id == '' }}
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          # Everything this step does lives in central-preflight-step.sh, which is covered by
          # .github/scripts/test/preflight-step-scenarios.sh. What CANNOT move there is the
          # check that the helper checkout happened at all — a script cannot verify its own
          # absence. If it did not happen (a tolerated failure on a dry run, see above), this
          # step must still not fail: the whole check is an optimisation, and the release
          # behaves exactly as it did before it existed.
          helper=".octopus-base-helper/.github/scripts"
          if [ ! -f "$helper/central-preflight-step.sh" ]; then
            echo "::warning title=Central preflight skipped::The release helpers are not on disk, so whether $BUILD_VERSION is already on Maven Central could not be checked. Continuing."
            exit 0
          fi

          HELPER_DIR="$helper" bash "$helper/central-preflight-step.sh"

      # gradle build
      - name: Gradle build
        if: inputs.docker-image == ''
        # shellcheck disable=SC2086 # SKIP_TESTS intentionally word-splits into `-x <task>` pairs
        run: ./gradlew build $SKIP_TESTS -PbuildVersion="$BUILD_VERSION" -Pversion="$BUILD_VERSION" --info -s

      - name: Gradle build docker image
        if: inputs.docker-image
        env:
          DOCKER_IMAGE: ${{ inputs.docker-image }}
        # shellcheck disable=SC2086 # SKIP_TESTS intentionally word-splits into `-x <task>` pairs
        run: ./gradlew build dockerBuildImage $SKIP_TESTS -Pdocker.image="$DOCKER_IMAGE" -Poctopus.github.docker.registry=ghcr.io -Pdocker.registry=docker.io -PbuildVersion="$BUILD_VERSION" -Pversion="$BUILD_VERSION" --info -s

      # push to docker
      - name: Log in to Docker Registry
        if: inputs.docker-image && !inputs.dry-run
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to docker registry
        if: inputs.docker-image && !inputs.dry-run
        env:
          DOCKER_IMAGE: ${{ inputs.docker-image }}
        run: docker push "ghcr.io/octopusden/$DOCKER_IMAGE:$BUILD_VERSION"

      # Maven Central is for artifacts other projects consume as a DEPENDENCY. A Spring Boot
      # executable jar or a shadow/uber jar there is usually unintended — Gradle module metadata
      # can pull the shadow variant into `from(components.java)` without anyone asking — and a
      # single such artifact can exceed the org's entire monthly Central size quota.
      # Publish to a throwaway local repository first and inspect what would be uploaded, so an
      # oversized artifact fails the release BEFORE it reaches Central, where versions are
      # immutable. Runs in dry-run too: that is where the check is cheapest to act on.
      # Signing is force-disabled for this invocation — the guard must not need the GPG key, and
      # unsigned artifacts are enough to inspect names, sizes and archive contents.
      - name: Guard against publishing fat jars to Maven Central
        if: ${{ inputs.publish-to-nexus && inputs.resume-deployment-id == '' }}
        env:
          FAT_JAR_ALLOWLIST: ${{ inputs.fat-jar-publication-allowlist }}
          MAX_ARTIFACT_MB: ${{ inputs.max-central-artifact-mb }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail

          GUARD_REPO="$RUNNER_TEMP/m2-publication-guard"
          rm -rf "$GUARD_REPO"

          cat > "$RUNNER_TEMP/no-signing.init.gradle" <<'GRADLE'
          allprojects { proj ->
              proj.plugins.withId('signing') {
                  proj.extensions.getByName('signing').required = false
              }
          }
          GRADLE

          # -Pnexus=true must match the real upload below: some consumers shape their plugins
          # and publications on that property, so without it this dry publication could inspect
          # a different artifact set than the one publishToSonatype actually uploads.
          ./gradlew publishToMavenLocal \
            -Pnexus=true \
            -Dmaven.repo.local="$GUARD_REPO" \
            --init-script "$RUNNER_TEMP/no-signing.init.gradle" \
            -PbuildVersion="$BUILD_VERSION" -Pversion="$BUILD_VERSION" -s

          # This guard is a real gate, unlike the fail-open Central preflight: being unable to
          # run it IS a reason not to publish to an immutable repository. A dry run publishes
          # nothing and tolerates a failed helper fetch, so there it is a warning.
          inspector=".octopus-base-helper/.github/scripts/inspect-publication-set.py"
          if [ ! -f "$inspector" ]; then
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::warning title=Publication set not inspected::${inspector} is not on disk, so what this build would publish was not checked. Continuing because this is a dry run; a real release would refuse."
              exit 0
            fi
            echo "::error title=Cannot inspect the publication set::${inspector} is not on disk, so what this release would publish to Maven Central cannot be checked. Refusing to publish unverified artifacts to an immutable repository." >&2
            exit 1
          fi

          DRY_RUN="${DRY_RUN}" python3 "$inspector" "$GUARD_REPO"

      # Bind -PstagingProfileId to the gradle-nexus publish-plugin extension for
      # every project that applies it, without requiring any consumer build-script
      # change. Bypasses the flaky OSSRH-compat staging-profile auto-lookup. No-op
      # when staging-profile-id is blank (falls back to auto-lookup).
      - name: Prepare staging-profile init script
        if: ${{ !inputs.dry-run && inputs.publish-to-nexus && inputs.resume-deployment-id == '' }}
        run: |
          cat > "$RUNNER_TEMP/staging-profile.init.gradle" <<'GRADLE'
          allprojects { proj ->
              proj.plugins.withId('io.github.gradle-nexus.publish-plugin') {
                  def spid = proj.findProperty('stagingProfileId')?.toString()?.trim()
                  if (spid) {
                      proj.extensions.getByName('nexusPublishing')
                          .repositories.all { repo -> if (repo.name == 'sonatype') repo.stagingProfileId.set(spid) }
                  }
              }
          }
          GRADLE
          echo "Wrote $RUNNER_TEMP/staging-profile.init.gradle"

      # Upload + close the staging repository. The Nexus2-compat `release`
      # transition is NOT used: it leaves the deployment `closed`, so nothing ever
      # reaches Maven Central. The publish is driven explicitly through the Central
      # Portal API in the next step. Skipped entirely when resuming an existing
      # deployment (the artifacts are already uploaded).
      - name: Publish to Sonatype Nexus
        id: publish-sonatype
        if: ${{ !inputs.dry-run && inputs.publish-to-nexus && inputs.resume-deployment-id == '' }}
        run: |
          set -o pipefail
          ./gradlew -Pnexus=true -PstagingProfileId="$STAGING_PROFILE_ID" --init-script "$RUNNER_TEMP/staging-profile.init.gradle" publishToSonatype closeSonatypeStagingRepository -PbuildVersion="$BUILD_VERSION" -Pversion="$BUILD_VERSION" --info -s 2>&1 | tee "$RUNNER_TEMP/publish.log"
        env:
          STAGING_PROFILE_ID: ${{ inputs.staging-profile-id }}
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}

      # Explicit Central Portal publish: map the closed staging repository to its
      # Portal deployment, wait for VALIDATED, verify it is really OUR version and
      # namespace, publish, wait for PUBLISHED, and confirm every artifact is
      # resolvable on Maven Central. Only then may the release/tag be created.
      - name: Publish deployment via Central Portal
        id: portal-publish
        if: ${{ !inputs.dry-run && inputs.publish-to-nexus }}
        run: bash .octopus-base-helper/.github/scripts/portal-publish.sh
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          STAGING_PROFILE_ID: ${{ inputs.staging-profile-id }}
          PUBLISH_LOG: ${{ runner.temp }}/publish.log
          RESUME_DEPLOYMENT_ID: ${{ inputs.resume-deployment-id }}

      # On a Sonatype publish failure, surface WHY (and whether a retry can help):
      #  (1) HTTP status + body of the account's staging profiles;
      #  (2) the deployment's validation errors via the SUPPORTED path
      #      (/manual/search/repositories -> portal_deployment_id -> Portal
      #      /api/v1/publisher/status .errors); the compat /activity endpoint is
      #      unsupported (HTTP 400) so it is not used;
      #  (3) an evidence-based classification emitted as log markers
      #      RELEASE_PUBLISH_CLASS / RELEASE_PUBLISH_RETRYABLE for the caller /
      #      TeamCity to scrape (reusable-workflow step outputs are unreliable on
      #      failed runs). retryable=true is asserted ONLY on unambiguous infra
      #      signals (5xx / timeout / reset); Portal validation errors are
      #      deterministic; everything else stays 'unknown'. Reads only the Gradle
      #      failure section to avoid false matches from --info chatter.
      - name: Diagnose & classify Sonatype publish failure
        if: ${{ failure() && (steps.publish-sonatype.outcome == 'failure' || steps.portal-publish.outcome == 'failure') && !inputs.dry-run }}
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          RESUME_ID: ${{ inputs.resume-deployment-id }}
        run: |
          set +e
          host="https://ossrh-staging-api.central.sonatype.com"
          compat="$host/service/local"
          portal="https://central.sonatype.com/api/v1/publisher"
          log="$RUNNER_TEMP/publish.log"
          net=(--connect-timeout 15 --max-time 60)
          auth=("${net[@]}" -u "${MAVEN_USERNAME}:${MAVEN_PASSWORD}" -H 'Accept: application/json')
          bearer="Authorization: Bearer $(printf '%s:%s' "${MAVEN_USERNAME}" "${MAVEN_PASSWORD}" | base64 | tr -d '\n')"

          # GET (basic auth) into a file, print HTTP status, jq; raw body on parse-fail.
          dump() { # label url jq-filter
            local f; f="$RUNNER_TEMP/diag-$(echo "$1" | tr -c 'a-zA-Z0-9' _).json"
            local code; code=$(curl -sS -o "$f" -w '%{http_code}' "${auth[@]}" "$2" 2>/dev/null)
            echo "GET $2 -> HTTP ${code:-?}"
            local out; out=$(jq -r "$3" "$f" 2>/dev/null)
            if [ -n "$out" ]; then echo "$out"; else echo "  (unparsed body):"; head -c 2000 "$f"; echo; fi
          }

          echo "::group::Staging profiles visible to this account"
          dump "profiles" "$compat/staging/profiles" '.data[]? | "  name=\(.name)  id=\(.id)"'
          echo "::endgroup::"

          # Validation reason: the compat /activity endpoint is unsupported (HTTP 400),
          # so map the staging repo -> Portal deployment and read its .errors.
          portal_errors=""
          repo=$(grep -oE "Created staging repository '[^']+'" "$log" 2>/dev/null | head -1 | sed -E "s/^.*'([^']+)'.*$/\1/")
          if [ -n "$repo" ]; then
            echo "::group::Deployment status & validation errors for $repo"
            sf="$RUNNER_TEMP/diag-search.json"
            scode=$(curl -sS -o "$sf" -w '%{http_code}' "${net[@]}" -H "$bearer" -H 'Accept: application/json' "$host/manual/search/repositories" 2>/dev/null)
            echo "GET /manual/search/repositories -> HTTP ${scode:-?}"
            # The search 'key' is prefixed (e.g. "<user>/any/org.octopusden--<uuid>"),
            # so match on the repo id as a suffix rather than exact equality.
            did=$(jq -r --arg k "$repo" '.repositories[]? | select(.key | endswith($k)) | .portal_deployment_id' "$sf" 2>/dev/null | head -1)
            if [ -n "$did" ] && [ "$did" != "null" ]; then
              stf="$RUNNER_TEMP/diag-status.json"
              # Poll while the deployment is still validating; .errors appear only once FAILED.
              for i in 1 2 3 4 5; do
                pcode=$(curl -sS -o "$stf" -w '%{http_code}' "${net[@]}" -X POST -H "$bearer" -H 'Accept: application/json' "$portal/status?id=$did" 2>/dev/null)
                dstate=$(jq -r '.deploymentState // "?"' "$stf" 2>/dev/null)
                echo "POST /api/v1/publisher/status?id=$did (try $i) -> HTTP ${pcode:-?}  deploymentState=${dstate}"
                case "$dstate" in PENDING|VALIDATING|PUBLISHING) sleep 5 ;; *) break ;; esac
              done
              errs=$(jq -r 'if (.errors|type)=="object" then (.errors|to_entries[]|"  - \(.key): \(.value|tostring)") elif (.errors|type)=="array" then (.errors[]|"  - \(.|tostring)") else empty end' "$stf" 2>/dev/null)
              if [ -n "$errs" ]; then
                echo "  errors:"; echo "$errs"; portal_errors="$errs"
              else
                echo "  (no errors parsed; raw status body):"; head -c 2000 "$stf"; echo
              fi
            else
              echo "  No Portal deployment mapped for $repo — the close/release step did not hand the repository off to the Portal (typical for compat close/release failures), so there are no Portal validation errors to inspect."
            fi
            echo "::endgroup::"
          else
            if [ -n "${RESUME_ID:-}" ]; then
              echo "Resume mode: no local publish log (the upload was skipped by design)."
            else
              echo "No staging repository was created (failure before repo creation)."
            fi
          fi

          # Classify. Deterministic = Portal reported validation errors, or an explicit
          # auth failure. Transient = ONLY unambiguous infra signals. Everything else is
          # unknown (do NOT assert a retry will help). Reads only the Gradle failure section.
          sec=$(awk '/FAILURE: Build failed/{f=1} f{print}' "$log" 2>/dev/null)
          [ -z "$sec" ] && sec=$(tail -n 400 "$log" 2>/dev/null)
          cls="unknown"; retryable="unknown"
          if [ -n "$portal_errors" ] || printf '%s' "$sec" | grep -qiE 'responded with status code 40[13]|401 Unauthorized|403 Forbidden'; then
            cls="deterministic"; retryable="false"
          elif [ -n "$repo" ]; then
            # Artifacts are already staged (and possibly handed off to the Portal):
            # a plain re-dispatch would upload this version a second time.
            cls="resumable"; retryable="false"
            echo "RELEASE_PUBLISH_COMPAT_KEY=$repo"
            [ -n "${did:-}" ] && [ "${did:-}" != "null" ] && echo "RELEASE_PUBLISH_RESUME_DEPLOYMENT_ID=$did"
          elif printf '%s' "$sec" | grep -qiE 'responded with status code 5[0-9][0-9]|status code 5[0-9][0-9]|timed out|Read timed out|Connection reset|Connection refused'; then
            cls="transient"; retryable="true"
          fi
          # The Portal publish helper classifies its own failures precisely (it knows
          # whether a deployment exists and is resumable). Only classify here when it
          # did not, i.e. the failure happened in the Gradle upload/close stage.
          if [ -f "$RUNNER_TEMP/publish-classified" ]; then
            echo "Classification already emitted by the Portal publish step (see above)."
          else
            echo "RELEASE_PUBLISH_CLASS=${cls}"
            echo "RELEASE_PUBLISH_RETRYABLE=${retryable}"
            case "$cls" in
              deterministic) echo "::error title=Deterministic publish failure::Validation / auth error (see deployment errors above) — retrying will NOT help. Fix the artifact/credentials; do not re-dispatch." ;;
              transient)     echo "::warning title=Transient publish failure::Infrastructure instability (5xx/timeout) before anything was staged — a re-dispatch may succeed." ;;
              resumable)     echo "::error title=Resumable publish failure::The version is already staged, so a plain re-dispatch would upload it twice. Finish it with resume-deployment-id (see the id/compat key above), or drop that staging repository first." ;;
              *)             echo "::warning title=Unclassified publish failure::Could not classify — inspect the deployment errors and log above; there is no evidence a retry will help." ;;
            esac
          fi

  # Tagging and release creation are a separate job deliberately. They run after the
  # artifacts are published, and publishing is irreversible: Maven Central refuses a
  # version that already exists. Were these steps in the publish job, GitHub's "re-run
  # failed jobs" would restart the publish and die there, so the recovery this job's own
  # error message describes could never be reached. Split, a re-run repeats only this
  # job — it finds the tag (created by hand if the refusal persists) and attaches the
  # release to it, while the successful publish stays untouched.
  #
  # No `environment:` here on purpose: this job needs only GITHUB_TOKEN, and inheriting
  # the publish job's environment would ask a protected environment to approve twice.
  tag-and-release:
    name: Tag and release
    if: ${{ !inputs.dry-run }}
    needs: prepare-build-publish-release
    runs-on: ubuntu-latest
    steps:
      # The tag is created at the commit the build job actually built. The replaced
      # action, marvinpinto/action-automatic-releases, had no target-commit input: it
      # tagged `context.sha`, which for the repository_dispatch runs every release uses
      # is the default-branch head at dispatch time, frozen for the run, regardless of
      # what was checked out. A hybrid release of anything other than the current tip
      # therefore tagged code that was never built.
      # This job otherwise has no checkout. The retry below is a script rather than an inline
      # loop so it can be tested (see .github/workflows/test-wait-for-tag-ref.yml), and a script
      # has to be fetched. Pinned to job.workflow_sha — the same commit as this workflow — so the
      # helper can never drift from the logic that calls it. Same mechanism the publish helper
      # already uses in the build job.
      - name: Resolve tag-wait helper ref
        id: tagwait-ref
        env:
          HELPER_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [[ ! "${HELPER_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Cannot pin the tag-wait helper::job.workflow_sha resolved to '${HELPER_SHA}', which is not a full commit SHA." >&2
            exit 1
          fi
          echo "sha=${HELPER_SHA}" >> "$GITHUB_OUTPUT"

      - name: Fetch tag-wait helper
        uses: actions/checkout@v4
        with:
          repository: octopusden/octopus-base
          ref: ${{ steps.tagwait-ref.outputs.sha }}
          path: .octopus-base-tagwait
          sparse-checkout: .github/scripts

      # The body of this step is `.github/scripts/tag-and-release.sh`, shared with the Maven flow
      # and, later, with the #189 recovery. It was two inline copies that had already diverged —
      # the Maven one grew a stranded-draft path this one lacked — and its branches could not be
      # tested at all while they were step bodies. They are now covered by
      # .github/scripts/test/tag-and-release-scenarios.sh, verified by mutation.
      #
      # No RELEASE_ASSET: this flow attaches nothing to the release, so the release is created
      # published, with no draft phase and therefore no draft to strand.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, and `gh release …` resolves the repository from the
          # git remote — GITHUB_REPOSITORY is not consulted, GH_REPO is the only documented
          # override. Without it every release subcommand dies with "failed to run git:
          # not a git repository", after the artifacts are published. The sibling `gh api`
          # calls are unaffected because they name the repository in the path.
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare-build-publish-release.outputs.build-version }}
          BUILT_SHA: ${{ needs.prepare-build-publish-release.outputs.built-sha }}
        run: bash .octopus-base-tagwait/.github/scripts/tag-and-release.sh

      # Bind the release to the run that produced it. Registration happens afterwards
      # in a workflow_run context whose only trustworthy identity is this run's id and
      # attempt: a tag cannot say which release a run made when several releases share
      # a commit, and "the newest release" can move on while that job is queued. The
      # attempt is part of it because a rerun keeps the run id while the public flow
      # recomputes the version, so two releases would otherwise carry the same mark.
      # The marker is a delimited HTML comment: invisible in the rendered notes, and
      # not a prefix of another run's marker (555/1 vs 555/10).
      - name: Stamp the release with this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Set for the same reason as above. This step only uses `gh api` with explicit
          # repository paths, so it does not need it today — but a future `gh release` call
          # added here would fail in a way that is hard to read.
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.prepare-build-publish-release.outputs.build-version }}
          MARKER: "<!-- octopus-release-run: ${{ github.run_id }}/${{ github.run_attempt }} -->"
        run: |
          set -euo pipefail
          release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id')"
          body="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" --jq '.body // ""')"
          printf '%s\n\n%s\n' "$body" "$MARKER" > "$RUNNER_TEMP/release-body.md"
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F body=@"$RUNNER_TEMP/release-body.md" --jq '.tag_name' > /dev/null
          echo "Release ${TAG} stamped with '${MARKER}'"

  register-release-in-log:
      # register release in octopus-release-log
      if: inputs.register-release-immediately && !inputs.dry-run
      # Both: the version comes from the build job, but the release must exist first.
      needs: [prepare-build-publish-release, tag-and-release]
      uses: ./.github/workflows/common-register-release.yml
      name: Register release
      with:
        octopus-repository: ${{ github.repository }}
        release-version: ${{ needs.prepare-build-publish-release.outputs.build-version }}
      secrets: inherit
